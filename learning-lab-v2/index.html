<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-DLC v2 Learning Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a calm three-panel studio. Lesson guide on the left, the project (files or the running app) in the middle, the AI assistant on the right. One red-outlined panel at a time shows where to look. */
  --bg:#ECEDEF; --panel:#FFFFFF; --panel2:#F5F6F7; --ink:#1B1D21; --muted:#5F656D; --line:#DADDE1;
  --accent:#C2202B; --soft:#FBE9EA; --po:#C0262D; --eng:#1F5FBF; --pm:#0F7B6C; --ux:#7A3EB1; --arch:#B4540A; --good:#2B7D3B; --warn:#A8650A; --bar:#1B1D21;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1013; --panel:#191B1F; --panel2:#1F2227; --ink:#ECEEF1; --muted:#9BA1A9; --line:#2D3138;
  --accent:#F0595F; --soft:#3A1F22; --po:#F07075; --eng:#7EA8F0; --pm:#4FC1AE; --ux:#B892E8; --arch:#F0A35E; --good:#6CC17A; --warn:#E0B04F; --bar:#08090A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1013; --panel:#191B1F; --panel2:#1F2227; --ink:#ECEEF1; --muted:#9BA1A9; --line:#2D3138;
  --accent:#F0595F; --soft:#3A1F22; --po:#F07075; --eng:#7EA8F0; --pm:#4FC1AE; --ux:#B892E8; --arch:#F0A35E; --good:#6CC17A; --warn:#E0B04F; --bar:#08090A; color-scheme:dark;}
/* Base size. 12.8px at 1440 x 860, growing with whichever of width or height is tighter, up to 32px.
   The size buttons multiply it. Phones keep 16px: they show one panel at a time. */
html{font-size:calc(clamp(12.8px,min(0.8889vw,1.4884vh),32px) * var(--uz,1))}
@media (max-width:980px){html{font-size:calc(16px * var(--uz,1))}}
.zoom{display:inline-flex;align-items:center;border:1px solid rgba(241,242,243,.25);border-radius:0.5rem;overflow:hidden}
.zoom button{all:unset;cursor:pointer;font:600 0.8125rem/1 var(--sans);padding:0.5rem 0.625rem;color:#F1F2F3;white-space:nowrap}
.zoom button:hover:not(:disabled){background:rgba(241,242,243,.1)}
.zoom button:disabled{opacity:.35;cursor:default}
.zoom button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.zoom .zl{font:500 0.75rem/1 var(--mono);min-width:2.75rem;text-align:center;padding:0.5rem 0.25rem;border-left:1px solid rgba(241,242,243,.2);border-right:1px solid rgba(241,242,243,.2)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:0.9375rem/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.2}
.k{font:600 0.6875rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:0.1875rem solid var(--accent);outline-offset:0.125rem}

/* top bar */
.top{background:var(--bar);color:#F1F2F3;display:flex;align-items:center;gap:1.125rem;padding:0.5rem 0.875rem;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:0.625rem;font-weight:700;font-size:1rem;white-space:nowrap}
.brand i{width:1.625rem;height:1.625rem;border-radius:0.4375rem;background:#C2202B;display:grid;place-items:center;font:700 0.75rem/1 var(--mono);font-style:normal;color:#fff}
.stepper{flex:1;display:flex;align-items:flex-end;gap:0.625rem;min-width:0;overflow-x:auto;padding:0.125rem 0}
.ph{display:flex;flex-direction:column;gap:0.25rem}
.ph .pn{font:600 0.5938rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(241,242,243,.55)}
.ph .ds{display:flex;gap:0.1875rem}
.dot{all:unset;cursor:pointer;width:1.625rem;height:1.625rem;border-radius:50%;display:grid;place-items:center;font:600 0.7188rem/1 var(--mono);color:rgba(241,242,243,.6);border:0.0938rem solid rgba(241,242,243,.28)}
.dot.done{background:#2B7D3B;border-color:#2B7D3B;color:#fff}
.dot.now{background:#C2202B;border-color:#C2202B;color:#fff;box-shadow:0 0 0 0.25rem rgba(194,32,43,.35)}
.dot.view{outline:0.125rem solid #fff;outline-offset:0.125rem}
.dot.skip{border-style:dashed;color:rgba(241,242,243,.5)}
.now-name{font-size:0.8438rem;color:rgba(241,242,243,.85);white-space:nowrap;align-self:center}
.tools{display:flex;align-items:center;gap:0.5rem}
.tb{all:unset;cursor:pointer;font:500 0.8125rem/1 var(--sans);padding:0.5rem 0.625rem;border-radius:0.5rem;border:1px solid rgba(241,242,243,.25);white-space:nowrap}
.tb:hover{background:rgba(241,242,243,.1)}
.tb[aria-pressed="true"]{background:#F1F2F3;color:#1B1D21}
#btn-theme{display:inline-flex;align-items:center;gap:0.5625rem}
.saber{display:inline-flex;flex-direction:column;align-items:center;margin:-0.3125rem 0;--sc:#FF3B45}
#btn-theme[data-mode="dark"] .saber{--sc:#3D9BFF}
.saber .blade{width:0.1875rem;height:0.9375rem;border-radius:0.125rem 0.125rem 0 0;background:var(--sc);box-shadow:0 0 0.25rem 1px var(--sc),0 0 0.5625rem 1px color-mix(in srgb,var(--sc) 55%,transparent);transform-origin:50% 100%;transition:transform .28s ease-in}
#btn-theme.sheath .blade{transform:scaleY(0)}
.saber .hilt{width:0.3125rem;height:0.4375rem;border-radius:1px 1px 0.125rem 0.125rem;background:linear-gradient(#C9CDD3 0 0.125rem,#7D838C 0.125rem 0.1875rem,#A4A9B1 0.1875rem)}

.pop{position:absolute;right:0.875rem;top:3.375rem;z-index:40;width:min(23.75rem,calc(100vw - 1.75rem));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:0.875rem;box-shadow:0 1.125rem 3.125rem rgba(0,0,0,.25);padding:0.875rem;display:flex;flex-direction:column;gap:0.5rem;max-height:70vh;overflow:auto}
.bcard{display:flex;gap:0.625rem;align-items:flex-start;padding:0.5rem 0.625rem;border-radius:0.625rem;border:1px solid var(--line);opacity:.5}
.bcard.on{opacity:1;background:var(--soft);border-color:var(--accent)}
.bcard span.e{font-size:1.375rem;line-height:1}.bcard:not(.on) span.e{filter:grayscale(1)}
.bcard p{font-size:0.8125rem;color:var(--muted)}
#toast{position:fixed;top:3.75rem;left:50%;transform:translateX(-50%);z-index:60;background:var(--bar);color:#fff;padding:0.625rem 1rem;border-radius:62.4375rem;font-weight:500;box-shadow:0 0.625rem 1.875rem rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2)}

/* main grid */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(14.375rem,var(--wl,18.75rem)) 0.625rem minmax(18.75rem,1fr) 0.625rem minmax(14.375rem,var(--wr,25rem));gap:0;padding:0.625rem}
.split{cursor:col-resize;position:relative;touch-action:none;border-radius:0.375rem}
.split::after{content:"";position:absolute;left:50%;top:50%;width:0.25rem;height:2.5rem;border-radius:0.25rem;transform:translate(-50%,-50%);background:color-mix(in srgb,var(--muted) 45%,transparent);transition:height .15s,background .15s}
.split:hover::after,.split.drag::after,.split:focus-visible::after{background:var(--accent);height:4.5rem}
body.resizing{user-select:none;cursor:col-resize}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:0.875rem;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;transition:box-shadow .2s}
.pane.attn,.composer.attn{box-shadow:0 0 0 0.1875rem var(--accent)}
.pane.working{box-shadow:0 0 0 0.1875rem color-mix(in srgb,var(--muted) 55%,transparent)}
.phd{display:flex;align-items:center;gap:0.5rem;padding:0.625rem 0.875rem;border-bottom:1px solid var(--line);flex:0 0 auto}
.phd h2{font-size:0.8125rem;font-weight:600;letter-spacing:.02em}
.scroll{flex:1;min-height:0;overflow-y:auto}

/* guide */
.g-body{padding:1rem 1.125rem 1.25rem;display:flex;flex-direction:column;gap:0.875rem}
.chipst{display:inline-flex;gap:0.375rem;align-items:center;font:600 0.6875rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.g-body h2{font-size:1.5rem;font-weight:700}
.g-body h3{font-size:1.0625rem;font-weight:600}
.sdots{display:flex;gap:0.3125rem;align-items:center}
.sdots i{width:1.375rem;height:0.3125rem;border-radius:0.5625rem;background:var(--line)}
.sdots i.d{background:var(--good)}.sdots i.c{background:var(--accent)}
.g-body p{max-width:62ch}
.g-body ul{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:0.3125rem}
.idea{border-left:0.25rem solid var(--accent);background:var(--soft);border-radius:0 0.625rem 0.625rem 0;padding:0.625rem 0.75rem}
.idea b{display:block;font:600 0.6875rem/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.box{border:1px solid var(--line);border-radius:0.625rem;padding:0.625rem 0.75rem;display:flex;flex-direction:column;gap:0.375rem;background:var(--panel2)}
.outs{list-style:none;padding:0!important;gap:0.25rem!important}
.outs li{display:flex;gap:0.5rem;align-items:center;font:0.8125rem/1.4 var(--mono)}
.outs .tk{width:1rem;height:1rem;border-radius:0.25rem;border:0.0938rem solid var(--muted);display:grid;place-items:center;font-size:0.6875rem;flex:0 0 auto}
.outs li.w .tk{background:var(--good);border-color:var(--good);color:#fff}
.flink{all:unset;cursor:pointer;font-family:var(--mono);font-size:.9em;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:0.1875rem}
.role{border-left:0.25rem solid var(--rc);padding:0.125rem 0 0.125rem 0.75rem}
.role b{color:var(--rc)}
.opt{all:unset;cursor:pointer;display:block;border:0.0938rem solid var(--line);border-radius:0.625rem;padding:0.625rem 0.75rem;background:var(--panel)}
.opt:hover{border-color:var(--muted)}
.opt.no{border-color:var(--warn)}.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--panel))}
.fb{font-size:.92em;margin-top:0.375rem;display:block}
.opt.no .fb{color:var(--warn)}.opt.ok .fb{color:var(--good)}
.g-foot{flex:0 0 auto;border-bottom:1px solid var(--line);padding:0.75rem 0.875rem;display:flex;flex-direction:column;gap:0.5rem;background:var(--panel2)}
.move{display:flex;gap:0.625rem;align-items:center}
.move .lab{flex:0 0 auto;font:700 0.6875rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#fff;padding:0.375rem 0.5rem;border-radius:0.375rem}
.move .lab.wait{background:var(--muted)}
.btn{border:0.0938rem solid var(--line);background:var(--panel);border-radius:0.625rem;padding:0.625rem 0.875rem;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:0.375rem 0.625rem;font-size:0.8125rem;font-weight:500}
.navrow{display:flex;gap:0.375rem;align-items:center;justify-content:space-between}

/* workspace */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:0.5625rem;overflow:hidden;background:var(--panel2)}
.seg{flex:0 0 auto}
.seg button{all:unset;cursor:pointer;padding:0.4375rem 0.75rem;font:500 0.8125rem/1 var(--sans);white-space:nowrap}
.phd h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg.sm button{padding:0.3125rem 0.5625rem;font-size:0.75rem}
.wsb{flex:1;min-height:0;display:grid;grid-template-columns:14.375rem minmax(0,1fr)}
.exp{border-right:1px solid var(--line);background:var(--panel2);overflow-y:auto;padding:0.5rem 0.375rem 1rem;font:0.8125rem/1.35 var(--mono)}
.exp .root{font:600 0.6875rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0.375rem 0.5rem 0.5rem}
.dir{color:var(--muted);padding:0.25rem 0.5rem;white-space:nowrap}
.frow{all:unset;cursor:pointer;display:flex;align-items:center;gap:0.375rem;padding:0.25rem 0.5rem;border-radius:0.375rem;width:100%;box-sizing:border-box;white-space:nowrap}
.frow:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.frow.cur{background:color-mix(in srgb,var(--ink) 11%,transparent);font-weight:600}
.frow .nm{overflow:hidden;text-overflow:ellipsis}
.frow .mk{margin-left:auto;font:600 0.625rem/1 var(--mono);padding:0.125rem 0.25rem;border-radius:0.25rem}
.mk.n{background:var(--good);color:#fff}.mk.m{background:var(--warn);color:#fff}
.frow.need{box-shadow:inset 0 0 0 0.125rem var(--accent);background:var(--soft);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 0.125rem var(--accent),0 0 0 0.25rem color-mix(in srgb,var(--accent) 25%,transparent)}}
.ed{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel2);flex:0 0 auto}
.tab{all:unset;cursor:pointer;font:0.7812rem/1 var(--mono);padding:0.5625rem 0.75rem;border-right:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.tab.cur{background:var(--panel);color:var(--ink);box-shadow:inset 0 0.125rem 0 var(--accent)}
.about{flex:0 0 auto;padding:0.5rem 0.875rem;border-bottom:1px solid var(--line);font-size:0.8438rem;display:flex;gap:0.5rem;align-items:baseline;flex-wrap:wrap}
.about .p{font:0.75rem/1.3 var(--mono);color:var(--muted)}
.code{flex:1;min-height:0;overflow:auto;padding:0.625rem 0 1.875rem;font:0.8438rem/1.65 var(--mono)}
.ln{display:flex}
.ln .no{flex:0 0 2.75rem;text-align:right;padding-right:0.75rem;color:color-mix(in srgb,var(--muted) 60%,transparent);user-select:none}
.ln .tx{flex:1;white-space:pre-wrap;word-break:break-word;padding-right:0.875rem;min-height:1.65em}
.ln.add{background:color-mix(in srgb,var(--good) 13%,transparent)}
.ln.add .no{color:var(--good)}
.t-h{font-weight:600;color:var(--accent)}.t-c{color:var(--muted);font-style:italic}.t-s{color:var(--pm)}.t-k{color:var(--eng);font-weight:500}.t-ok{color:var(--good);font-weight:600}.t-code{background:var(--panel2);border-radius:0.25rem;padding:0 0.1875rem}
.optline{all:unset;cursor:pointer;display:inline-block;padding:1px 0.625rem;border-radius:0.375rem;border:0.0938rem solid var(--line);margin:1px 0}
.optline:hover{border-color:var(--accent)}
.optline.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.optline:disabled{cursor:default;opacity:.75}
.own{font:600 0.6562rem/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:0.1875rem 0.375rem;border-radius:0.3125rem;color:#fff;background:var(--rc)}
:root[data-theme="dark"] .own{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .own{color:#111}}
.empty{flex:1;display:grid;place-items:center;color:var(--muted);padding:1.875rem;text-align:center}

/* app preview */
.pv{flex:1;min-height:0;overflow:auto;padding:1rem;background:var(--panel2)}
.browser{border:1px solid var(--line);border-radius:0.75rem;overflow:hidden;background:var(--panel);max-width:61.25rem;margin:0 auto;box-shadow:0 0.625rem 1.875rem rgba(0,0,0,.08)}
.bbar{display:flex;align-items:center;gap:0.625rem;padding:0.5rem 0.75rem;background:var(--panel2);border-bottom:1px solid var(--line)}
.bbar .d3{display:flex;gap:0.3125rem}.bbar .d3 i{width:0.625rem;height:0.625rem;border-radius:50%;background:var(--line)}
.url{flex:1;font:0.75rem/1 var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:62.4375rem;padding:0.375rem 0.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apph{display:flex;flex-wrap:wrap;gap:0.5rem 0.875rem;align-items:center;padding:0.875rem 1.125rem;border-bottom:1px solid var(--line)}
.apph b{font-size:1.0625rem}
.ver{font:500 0.75rem/1 var(--mono);padding:0.3125rem 0.5625rem;border-radius:62.4375rem;border:1px solid var(--line);color:var(--muted)}
.ver.new{border-color:var(--good);color:var(--good)}
.appg{display:grid;grid-template-columns:minmax(0,15.625rem) minmax(0,1fr);gap:0}
.people{border-right:1px solid var(--line);padding:0.75rem;display:flex;flex-direction:column;gap:0.5rem}
.person{all:unset;cursor:pointer;border:0.0938rem solid var(--line);border-radius:0.625rem;padding:0.5625rem 0.6875rem;display:flex;flex-direction:column;gap:0.125rem}
.person.sel{border-color:var(--ink);background:var(--panel2)}
.person small{color:var(--muted);font-size:0.7812rem}
.person.need{border-color:var(--accent);animation:pulse 1.5s ease-in-out infinite}
.res{padding:1rem 1.125rem;display:flex;flex-direction:column;gap:0.875rem;min-width:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:0.1875rem 0.875rem;font-size:0.875rem}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.outcome{display:flex;flex-wrap:wrap;gap:1.125rem;align-items:center;border-top:1px dashed var(--line);padding-top:0.875rem}
.gauge{flex:0 0 11.25rem;text-align:center}
.gauge .num{font:700 2.5rem/1 var(--mono);margin-top:-2.875rem}
.band{font:700 0.75rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:0.375rem}
.codes{flex:1 1 16.25rem;display:flex;flex-direction:column;gap:0.375rem;min-width:0}
.rc{display:flex;gap:0.5rem;align-items:baseline;border:1px solid var(--line);border-radius:0.5rem;padding:0.4375rem 0.625rem;font-size:0.875rem}
.rc code{font:600 0.75rem/1.4 var(--mono);white-space:nowrap}
.rc.warn{border-color:var(--accent);background:var(--soft)}.rc.warn code{color:var(--accent)}
.rc.info{border-color:var(--warn)}.rc.info code{color:var(--warn)}
.why{font-size:0.8438rem;color:var(--muted)}
pre.json{margin:0.5rem 0 0;background:var(--panel2);border-radius:0.5rem;padding:0.625rem;font:0.7812rem/1.5 var(--mono);overflow:auto}
details summary{cursor:pointer;font-size:0.8438rem;color:var(--muted)}

/* chat */
.chat{padding:0.875rem;display:flex;flex-direction:column;gap:0.625rem}
.m{max-width:94%;padding:0.5625rem 0.75rem;border-radius:0.75rem;font-size:0.9062rem;display:flex;flex-direction:column;gap:0.375rem}
.m.ai{background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:0.25rem}
.m.ai.ask{border:0.0938rem solid var(--rc,var(--accent))}
.m.me{background:var(--ink);color:var(--panel);align-self:flex-end;border-top-right-radius:0.25rem}
.m.term{background:#0E0F11;color:#D6D9DD;font:0.75rem/1.6 var(--mono);white-space:pre;overflow-x:auto;align-self:stretch;max-width:100%}
.m.term .p{color:#6CC17A}
.typing i{display:inline-block;width:0.375rem;height:0.375rem;border-radius:50%;background:var(--muted);margin-right:0.1875rem;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.composer{flex:0 0 auto;border-bottom:1px solid var(--line);max-height:60%;overflow-y:auto;padding:0.75rem;display:flex;flex-direction:column;gap:0.5rem;background:var(--panel2);margin:0;transition:box-shadow .2s}
.sugg{border:1px dashed var(--muted);border-radius:0.625rem;padding:0.5rem 0.625rem;background:var(--panel);font-size:0.875rem;max-height:8.125rem;overflow:auto}
.hintc{color:var(--muted);font-size:0.8438rem}
.chipb{text-align:left}

/* summary */
.sumv{flex:1;overflow:auto;padding:1.375rem;display:flex;flex-direction:column;gap:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:0.75rem}
.big{font:700 2.75rem/1 var(--mono);color:var(--accent)}

/* start overlay */
.veil{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bar) 72%,transparent);backdrop-filter:blur(0.3125rem);display:grid;place-items:center;padding:1rem;overflow:auto}

3. We combine the results into one score and a list of reason codes.

- \`tests/\` automated tests

14 agent definitions, an engine, hooks, sensors and rules to the project.

## The loop
1. The **engine** decides what runs next. It is deterministic: no guessing.
2. The **conductor** (this /aidlc session) runs it: a stage, a question, or a gate.
3. Each stage has a **lead agent**. Some also have a **reviewer agent**.
4. Every stage after Initialization ends with an **approval gate**.

- Initialization (3, automatic) · Ideation (7) · Inception (9)

feature, enterprise, mvp, poc, bugfix, refactor, infra, security-patch,

  body:()=>`<p>In v2 you start with the <b>/aidlc</b> command and describe the outcome you want.</p><p>Send the suggested message in the Agents panel.</p>`,
  after:()=>[{log:'Request: /aidlc '+intentText},{say:'Before I create anything, choose a workflow profile. Each one runs a different set of stages:<br>• <b>express</b>: 10 stages, the lightest path<br>• <b>classic</b>: 18 stages, v1-style<br>• <b>feature</b>: 33 stages, the full lifecycle at Standard depth<br>• <b>enterprise</b>: 33 stages at Comprehensive depth, for regulated work<br>Which should I run? If none fits, the composer can tailor one.', ask:true}]},
 {id:'plan', stage:'init', title:'Choose a workflow profile', act:{type:'choose', ok:2, opts:[
   {t:'express: the lightest requirements-to-code path', fb:'Too light. Express removes design and decision stages. The v2 guide says not to use it for ambiguous or regulated work, and this change touches personal data.'},
   {t:'classic: v1-style Inception and Construction', fb:'It would work, but it skips Ideation and leaves Operation as a placeholder. You would miss feasibility, scope and the feedback loop.'},
   {t:'feature: the full lifecycle at Standard depth', fb:'Yes. A production feature in an existing product. It runs every phase, from the idea to production feedback, at practical depth.'},
   {t:'enterprise: the full lifecycle at Comprehensive depth', fb:'Defensible, because of the personal data. But it writes the heaviest documents for every stage. For one check inside an existing product, feature with the constraints recorded is enough.'}]},
  body:()=>`<p>v2 does not push every piece of work through the same process. You pick a <b>workflow profile</b> (the engine calls it a scope), and that decides which of the 33 stages run, and how deep each goes.</p><p>Which profile fits this change?</p>`,
  after:()=>[{me:'Go ahead with the "feature" plan.'},{fn:()=>{S.planChosen=true;}},{log:'Workflow profile: feature'},{say:'Starting the feature plan: 33 stages, 30 approval gates. Creating the intent record…'},{write:P.state},{write:P.audit},{write:P.desc},{fn:()=>{S.appr=3;}},{sys:'Initialization: Workspace Scaffold, Workspace Detection and State Initialization done automatically. No approval needed.'},{say:'This is a <b>brownfield</b> project (existing code). Everything for this piece of work lives in its own record dir under <code>aidlc/spaces/default/intents/</code>.'}]},
 {id:'init-look', stage:'init', title:'One record per intent', act:{type:'open', paths:[P.state]},
  body:()=>`<p>In v2 each piece of work is an <b>intent</b>, with its own record dir inside a <b>space</b>. The state file, the audit trail and every stage's documents live there.</p><p>Open ${fl(P.state)} in the stage card. It lists all 33 stages for the feature plan, and marks each one done, in progress or skipped.</p>${idea('The record dir is the whole story of one piece of work: what was asked, what was decided, by whom, and when.')}`},

 {id:'ic-answer', stage:'ic', title:'Frame the intent', act:{type:'answer', qs:['ic1','q7'], file:P.icq, hint:'Answer the questions in the stage card.'},
  enter:()=>[{ag:'product', say:'I lead Intent Capture & Framing. I\'ve written 2 questions to <b>intent-capture-questions.md</b>. I can guide you through them, we can chat, or you can edit the file. In this lab you\'ll edit the file, and later stages reuse that choice.'},{write:P.icq}],
  body:()=>`<p>Ideation is new in v2. It shapes the idea before anyone writes requirements. The first stage frames the intent: the problem, who has it, and how you'll know it worked.</p><p>The questions are in the stage card on the right. Answer both. Each names who would usually answer it.</p><div class="box"><b>Three ways to answer</b><p>v2 asks once how you like to answer: <b>Guide me</b> (one question at a time in chat), <b>I'll edit the file</b>, or <b>Chat</b> (it pulls the decisions out of a conversation). All three end up in the questions file.</p></div>`,
  after:()=>[{fn:()=>{['ic1','q7'].forEach(q=>{S.lock[q]=true;}); ['ic1','q7'].forEach(q=>log(`Answered: ${QD[q].text} ${QD[q].opts[S.a[q]]}`));}},{ag:'product', say:'Thank you. Writing the intent statement and stakeholder map…'},{write:P.ist},{write:P.smap},
   {rev:'lead', verdict:'Concerns', say:'Advisory review: these findings are for your decision at the gate.', findings:[['R-01','Minor','intent-statement.md > Assumptions','A-01 has no source tag. Nothing in the request or the lender feedback says lenders want automatic declines.',P.ist,'A-01 Lenders want flagged applications declined automatically.'],['R-02','Minor','stakeholder-map.md','Lenders\' customers are not listed as stakeholders.',P.smap,'']]}]},
 {id:'ic-approve', stage:'ic', title:'Check the intent before you approve', act:{type:'chips', chips:()=>[approveChip(['ic'],'Market Research','Approve'),
    {label:'Request Changes: remove A-01. Lenders asked for a warning, not declines', text:'Remove assumption A-01. Lenders asked for a warning, not automatic declines.', stay:true, set:()=>{S.changes.assume=true; resolveFind('ic','R-01'); log('Requested change: remove assumption A-01');}, ops:()=>[{mod:P.ist},{badge:'assume'},{ag:'product', say:'Done. A-01 is removed, with the lender feedback as its source. The change is highlighted in intent-statement.md.'}]},
    {label:'Request Changes: make the success measure "the reason code is live"', text:'Change the success measure to "the reason code is live".', stay:true, ops:()=>[{ag:'product', say:`I'd keep it as it is. ${S.a.ic1==='B'?'It already says that, from your answer.':'Your answer measures the outcome lenders asked for. A live reason code is an output, not an outcome.'} I haven't changed it.`}]}]},
  enter:()=>[gate(['ic'],'Market Research','Approving accepts the open review findings as risk.')],
  body:()=>`<p>A separate agent, the <b>Product Lead reviewer</b>, has checked the Product agent's work. It never edits; it writes findings. In Ideation and Inception its review is <b>advisory</b>: the findings come to you at the gate.</p><p>Open ${fl(P.ist)} and read the <b>Assumptions</b> section, then read the findings in the Agents panel.</p><p>Approving accepts the findings as risk. You can also ask for a change first.</p>${idea('Reviewer agents help you check, but they don\'t decide. You do.')}`},
 {id:'fe-quiz', stage:'fe', also:['mr'], title:'Spot the constraint', act:{type:'choose', ok:0, opts:[
   {t:'C-01: application data is deleted after 7 days.', fb:'Yes. To count applications over time we need to keep them. This limits how far back the check can look.'},
   {t:'C-03: an assessment takes about 300 milliseconds.', fb:'Useful for judging speed later, but it doesn\'t limit what we can build.'},
   {t:'C-04: reason codes live in one list.', fb:'True, but adding a code to the list is straightforward.'}]},
  enter:()=>[{ag:'product', say:'Market Research: two vendors sell this check, but both need raw identity details sent to them. I recommend we build it. See <b>build-vs-buy.md</b>.'},{write:P.comp},{write:P.bvb},{ag:'architect', say:'Feasibility & Constraints: feasible inside the existing service. I\'ve recorded four constraints in <b>constraint-register.md</b>.'},{write:P.fea},{write:P.con},{write:P.raid}],
  body:()=>`<p>Two stages ran: the Product agent researched the market, and the <b>Architect agent</b> checked feasibility. In v2, constraints are found in Ideation, before requirements are written.</p><p>Open ${fl(P.con)}. Which constraint could get in the way of counting an identity's applications over time?</p>`},
 {id:'fe-approve', stage:'fe', also:['mr'], title:'Approve the research and feasibility', act:{type:'chips', chips:()=>[approveChip(['mr','fe'],'Scope Definition','Approve both stages')]},
  enter:()=>[gate(['mr','fe'],'Scope Definition','In a real run each stage has its own gate. The lab asks once for both.')],
  body:()=>`<p>Every stage after Initialization ends with an approval gate. To keep the lab moving, some steps here cover two stages and ask once.</p><p>Reply in the Agents panel.</p>`},
 {id:'sd-approve', stage:'tf', also:['sd'], title:'Scope and the mob', act:{type:'chips', chips:()=>[approveChip(['sd','tf'],'Rough Mockups','Approve both stages')]},
  enter:()=>[{ag:'product', say:'Scope Definition: I\'ve set what is in and out of scope in <b>scope-document.md</b>, and the backlog for this intent.'},{write:P.scope},{write:P.backlog},{ag:'delivery', say:'Team Formation: I propose a small mob of people to steer the agents: a product owner, an engineer and a fraud analyst. See <b>mob-composition.md</b>.'},{write:P.team},{write:P.mob},gate(['sd','tf'],'Rough Mockups')],
  body:()=>`<p>The Product agent defined the scope, and the <b>Delivery agent</b> proposed the mob: the few people who answer the agents' questions and approve their work.</p><p>Open ${fl(P.scope)} if you like. Note what is out of scope. Then approve.</p>`},
 {id:'rm-answer', stage:'rm', title:'How should the warning look?', act:{type:'answer', qs:['q8'], file:P.rmq, hint:'Answer the question in the stage card.'},
  enter:()=>[{ag:'design', say:'I lead Rough Mockups. One question for you in <b>rough-mockups-questions.md</b>: how should the warning look to a fraud analyst?'},{write:P.rmq}],
  body:()=>`<p>The <b>Design agent</b> sketches the change before any requirement is written. How a warning looks decides whether people notice it.</p><p>Answer the question in the stage card.</p>`,
  after:()=>[{fn:()=>{S.lock.q8=true; log(`Answered: ${QD.q8.text} ${QD.q8.opts[S.a.q8]}`);}},{write:P.wire},{write:P.flow},{rev:'lead', verdict:'READY', say:'The wireframe matches the intent and the answer.'}]},
 {id:'rm-approve', stage:'rm', title:'Approve the rough mockups', act:{type:'chips', chips:()=>[approveChip(['rm'],'Approval & Handoff','Approve')]},
  enter:()=>[gate(['rm'],'Approval & Handoff')], body:()=>`<p>Open ${fl(P.wire)} to see the sketch, then approve in the Agents panel.</p>`},
 {id:'ah-fix', stage:'ah', when:()=>!S.changes.assume, title:'The verification gate found something', act:{type:'chips', chips:()=>[{label:'Go back and fix it', text:'Go back and fix it.', ops:()=>[{fn:()=>{S.late.assume=true; resolveFind('ic','R-01');}},{ag:'product', say:'Intent Capture reopened. I\'ve removed A-01: lenders asked for a warning, not declines.'},{mod:P.ist},{log:'Intent Capture reopened after the Ideation verification gate: assumption A-01 removed'},{mod:P.vg1},{sys:'Verification gate, Ideation → Inception: passed'}]}]},
  enter:()=>[{ag:'delivery', say:'Writing the initiative brief…'},{write:P.brief},{write:P.dlog},{write:P.vg1},{sys:'Verification gate, Ideation → Inception: 1 issue'},{say:'<b>phase-check-ideation.md</b>: assumption A-01 in the intent statement (decline automatically) contradicts the scope document (declining is out of scope). Go back and fix it, or proceed anyway?', ask:true}],
  body:()=>`<p>At the end of each phase, v2 runs a <b>verification gate</b>: an automatic check that the documents agree with each other before the next phase builds on them.</p><p>It found the assumption the reviewer flagged at Intent Capture. Fixing it now means reopening an approved stage. Catching it at the first gate would have been cheaper.</p><p>Open ${fl(P.vg1)}, then reply.</p>`},
 {id:'ah-approve', stage:'ah', title:'Hand over to Inception', act:{type:'chips', chips:()=>[approveChip(['ah'],'Reverse Engineering','Approve')]},
  enter:()=>[...(S.changes.assume?[{ag:'delivery', say:'Writing the initiative brief…'},{write:P.brief},{write:P.dlog},{write:P.vg1},{sys:'Verification gate, Ideation → Inception: passed'}]:[]),gate(['ah'],'Reverse Engineering','Ideation is finished.')],
  body:()=>`<p>Open ${fl(P.brief)}: the one page that hands the idea to Inception. Approving ends Ideation.</p>${idea('Seven stages in, nothing has been designed or built. The idea has been framed, checked and scoped first.')}`},

 {id:'re-read', stage:'re', title:'The agent studies the existing code', act:{type:'open', paths:[P.arch]},
  enter:()=>[{ag:'developer', say:'Reverse Engineering: scanning the existing code… I\'ve written the code knowledge base (codekb). <b>architecture.md</b> is the one to read first.'},{write:P.arch},{write:P.cstruct},{write:P.tech}],
  body:()=>`<p>The <b>Developer agent</b> reads the code and writes down how the product works. With collaborators on, the Architect agent would then synthesise it; in the feature profile the developer works alone.</p><p>The codekb sits at space level, under <code>aidlc/spaces/default/codekb/</code>, so every later intent in this space reuses it.</p><p>Open ${fl(P.arch)} and read "Things to know before changing it".</p>`},
 {id:'re-approve', stage:'re', title:'Check the facts before you approve', act:{type:'chips', chips:()=>[approveChip(['re'],'Practices Discovery','Approve'),
    {label:'Request Changes: data is kept for 30 days, not 7', text:'Application data is kept for 30 days, not 7. Please correct architecture.md.', stay:true, ops:()=>[{ag:'developer', say:'I checked again. <b>storage/applications.py</b> sets RETENTION_DAYS = 7, so the summary is right on that point. I haven\'t changed it.'}]},
    {label:'Request Changes: a failed check adds 50 points, not 30', text:'architecture.md says a failed check adds 30 points. score.py says RAISE_BY = 50. Please correct it.', stay:true, set:()=>{S.changes.re=true; log('Requested change: correct architecture.md, 50 points not 30');}, ops:()=>[{mod:P.arch},{badge:'fact'},{ag:'developer', say:'You are right. <b>score.py</b> says 50. I\'ve corrected the codekb.'}]}]},
  enter:()=>[gate(['re'],'Practices Discovery','This stage has no reviewer agent, so checking it is down to you.')],
  body:()=>`<p>Reverse Engineering has no reviewer agent. The summary names the code files its facts come from, such as ${fl('src/scoring/score.py')} and ${fl(P.store)}. Open them and compare.</p><p>Approve if it's right. If not, request a change. Some drafts have a mistake in them; some don't.</p>`},
 {id:'pd-approve', stage:'pd', title:'How this team works', act:{type:'chips', chips:()=>[{...approveChip(['pd'],'Requirements Analysis','Approve'), ops:()=>[...approveChip(['pd'],'Requirements Analysis').ops(),{write:P.teammem},{sys:'Practices promoted to team memory: aidlc/spaces/default/memory/team.md'}]}]},
  enter:()=>[{ag:'pipeline', say:'Practices Discovery: I read the tests, build files and CI to see how this team works, and wrote rules the agents will follow from now on.'},{write:P.prac},{write:P.rules},{write:P.evid},gate(['pd'],'Requirements Analysis','On approval, the practices go into team memory for every future intent.')],
  body:()=>`<p>The <b>Pipeline & Deploy agent</b> leads Practices Discovery. It finds the team's habits from evidence in the project, and turns them into rules.</p><p>Open ${fl(P.rules)}. Rule R-T1 ("a test for every acceptance criterion") will matter later.</p>${idea('Rules are standing decisions the agents apply before they work. Sensors are automatic checks on what they produce.')}`},
 {id:'ra-answer', stage:'ra', title:'Answer the Product agent\'s questions', act:{type:'answer', qs:RQ, file:P.qs},
  enter:()=>[{ag:'product', say:'Requirements Analysis. I have 6 questions, in <b>requirements-analysis-questions.md</b>. Answering the way you chose earlier: edit the file. I won\'t guess.'},{write:P.qs}],
  body:()=>{ const n=RQ.filter(q=>S.a[q]).length; return `<p>This is where the product decisions are made. The questions are in the stage card. Choose an answer for each one. Each names who would usually decide.</p><div class="box"><b>${n} of ${RQ.length} answered</b><p>There are no wrong answers, but your choices shape what gets built. You'll see the result at the end.</p></div><p>When all are answered, press Continue. The Product agent then checks your answers against each other and against the constraints.</p>`; },
  after:()=>[{fn:()=>{ RQ.forEach(q=>{S.lock[q]=true;}); RQ.forEach(q=>log(`Answered: ${QD[q].text} ${QD[q].opts[S.a[q]]}`)); }},{me:'I\'ve answered all the questions.'},{ag:'product', say:'Checking your answers against each other, the lender feedback and constraint-register.md…'},{fn:()=>{S.follow=mkFollow();}},{mod:P.qs}]},
 {id:'ra-follow', stage:'ra', title:'The Product agent found something', act:{type:'answer', qs:['f1'], file:P.qs, hint:'Answer the follow-up at the bottom of the questions.'},
  enter:()=>[{ag:'product', say:S.follow.text+' I\'ve added it to the questions file.'}],
  body:()=>`<p>The agent compared your answers and found ${S.follow.kind==='ret'?'a <b>conflict</b> with the 7-day retention constraint from Feasibility':S.follow.kind==='cov'?'a <b>gap</b>: your choices would miss the case lenders complained about':'a <b>gap</b>: something the answers didn\'t cover'}.</p><p>Scroll to the bottom of the questions in the stage card and answer the follow-up.</p>`,
  after:()=>[{fn:()=>{S.lock.f1=true; log(`Answered follow-up: ${S.follow.opts[S.a.f1]}`);}},{me:'I\'ve answered the follow-up.'},{ag:'product', say:'Writing the requirements…'},{write:P.req},{rev:'lead', verdict:'READY', say:'Every requirement traces to an answer, and none conflicts with the constraints.'}]},
 {id:'ra-read', stage:'ra', title:'Read the requirements', act:{type:'open', paths:[P.req]},
  body:()=>`<p>Open ${fl(P.req)}. Look for your own decisions in it: the period, the threshold, and what happens when the check fires. The warning style comes from Rough Mockups, and the deadline from Intent Capture.</p>${idea('Decisions made in Ideation flow straight into the requirements. Nothing is asked twice.')}`},
 {id:'ra-approve', stage:'ra', title:'Approve the requirements', act:{type:'chips', chips:()=>[approveChip(['ra'],'User Stories','Approve')]},
  enter:()=>[gate(['ra'],'User Stories')], body:()=>`<p>The reviewer found nothing to raise. Approve in the Agents panel.</p>`},
 {id:'us-read', stage:'us', title:'Stories, and a finding', act:{type:'open', paths:[P.st]},
  enter:()=>[{ag:'product', say:'User Stories. This stage runs as a <b>mob</b>: with collaborators on, the design, developer and quality agents would add their views in parallel. The feature profile has collaborators off, so I drafted these alone.'},{write:P.pers},{write:P.st},
   {rev:'lead', verdict:'Concerns', say:'Advisory review. One finding for your decision.', findings:[['R-01','Major','stories.md > Story 2','"The reason is clear" cannot be tested. A tester could not answer yes or no.',P.st,'the reason is clear']]}],
  body:()=>`<p>User stories keep the work tied to real people. Their acceptance criteria become automated tests.</p><p>Open ${fl(P.st)} and read story 2, then the reviewer's finding in the Agents panel.</p>`},
 {id:'us-approve', stage:'us', title:'Decide what to do with the finding', act:{type:'chips', chips:()=>S.learn==='ask'?[
    {label:'Yes, keep that for next time', text:'Yes, keep it.', stay:true, set:()=>{S.learn='yes';}, ops:()=>[{mod:P.teammem},{log:'Learning kept: acceptance criteria must be measurable'},{say:'Kept. It\'s now in team memory, so every future intent in this space starts with it.'}]},
    {label:'No, just this time', text:'No, just this time.', stay:true, set:()=>{S.learn='no';}, ops:()=>[{say:'Understood. I won\'t keep it.'}]}]
   :[approveChip(['us'],'Refined Mockups','Approve'),
    ...(S.changes.stories?[]:[{label:'Request Changes: make story 2 testable', text:'Story 2 can\'t be tested. The warning must show how many applications were found and the time period.', stay:true, set:()=>{S.changes.stories=true; S.learn='ask'; resolveFind('us','R-01'); log('Requested change: make story 2 testable');}, ops:()=>[{mod:P.st},{badge:'editor'},{ag:'product', say:'Story 2 now says the warning must show the count and the time period.'},{say:'You asked me to make an acceptance criterion measurable. <b>Keep that for next time?</b>', ask:true}]}])]},
  enter:()=>[gate(['us'],'Refined Mockups','Approving accepts finding R-01 as risk.')],
  body:()=>`<p>The reviewer found the problem. You still decide. ${tight()?'Story 2 now names exactly what the warning must show.':'Approving now accepts R-01 as a risk: the vague criterion goes forward into the code.'}</p>${S.learn==='ask'?'<p>v2 has a <b>learning loop</b>: when you correct an agent in a way that should hold next time, it asks whether to keep it.</p>':''}${idea('An approval with open findings is a decision to accept risk. Make it on purpose.')}`},
 {id:'dd-approve', stage:'dd', also:['rx'], title:'Mockups and domain design', act:{type:'chips', chips:()=>[approveChip(['rx','dd'],'Units Generation','Approve both stages')]},
  enter:()=>[{ag:'design', say:'Refined Mockups: the detailed design and interaction spec are ready.'},{write:P.mock},{write:P.ispec},{rev:'lead', verdict:'READY', say:'Mockups match the stories.'},{ag:'architect', say:'Domain Design: one new component, and two decisions recorded as ADRs in <b>decisions.md</b>.'},{write:P.compo},{write:P.adr},{rev:'archrev', verdict:'READY', say:'Components fit the existing system. ADR-001 keeps raw identity details out of the new store.'},gate(['rx','dd'],'Units Generation')],
  body:()=>`<p>The Design agent refined the mockups, and the Architect agent designed the components. Both reviewers checked their work.</p><p>Open ${fl(P.adr)} to see the decisions, then approve.</p>`},
 {id:'cd-approve', stage:'cd', also:['ug'], title:'Units and contracts', act:{type:'chips', chips:()=>[approveChip(['ug','cd'],'Delivery Planning','Approve both stages')]},
  enter:()=>[{ag:'architect', say:'Units Generation: two units, <b>repeat-check</b> and <b>console-warning</b>, with their dependency and story map.'},{write:P.units},{write:P.dep},{write:P.map},{ag:'architect', say:'Contract Design: what the units promise each other, and the one addition lenders\' systems will see.'},{write:P.contract},{rev:'archrev', verdict:'READY', say:'Each unit can be built and verified on its own. The API change is backward compatible.'},gate(['ug','cd'],'Delivery Planning')],
  body:()=>`<p>A <b>unit of work</b> is a piece that can be built and checked on its own. Here: the check inside the API, and the warning in the console.</p><p>Open ${fl(P.contract)}: existing fields don't change, so lenders' systems keep working.</p>`},
 {id:'dp-read', stage:'dp', title:'Plan the delivery', act:{type:'open', paths:[P.bolt]},
  enter:()=>[{ag:'delivery', say:'Delivery Planning: the Bolt plan, risks and outside dependencies are ready.'},{write:P.bolt},{write:P.risk},{write:P.xdep}],
  body:()=>`<p>A <b>Bolt</b> is a planned delivery slice over one or more units, with its own definition of done.</p><p>Open ${fl(P.bolt)}. Bolt 1 is a <b>walking skeleton</b>: the smallest slice that works end to end. The feature profile builds and verifies it before anything else.</p>`},
 {id:'dp-cmd', stage:'dp', title:'Approve the verification command', act:{type:'chips', chips:()=>[{label:'Approve the command', text:'Approve.', ops:()=>[{log:'Construction verification command approved: pytest tests/ -q'},{say:'Recorded. Every unit checkpoint will run it.'}]}]},
  enter:()=>[{ag:'delivery', say:'I propose this <b>Construction verification command</b>: <code>pytest tests/ -q</code>. It runs at every unit checkpoint, and a unit can only be approved once it passes. Approve it?', ask:true}],
  body:()=>`<p>The engine only accepts a command a person has approved. An agent can't choose its own test at the last minute.</p><p>Reply in the Agents panel.</p>`},
 {id:'dp-approve', stage:'dp', title:'Finish Inception', act:{type:'chips', chips:()=>[approveChip(['dp'],'Functional Design','Approve')]},
  enter:()=>[{write:P.vg2},{sys:'Verification gate, Inception → Construction: passed'},gate(['dp'],'Functional Design','Inception is finished.')],
  body:()=>`<p>The second verification gate passed: every requirement maps to a story, every story to a unit, every unit to a Bolt. Open ${fl(P.vg2)} if you like.</p>${idea('Inception is finished, and not one line of code has been written. The thinking comes first.')}`},

 {id:'fd-answer', stage:'fd', title:'Unit 1: a business rule question', act:{type:'answer', qs:['b1'], file:P.fdq, hint:'Answer the question in the stage card.'},
  enter:()=>[{sys:'Construction · unit 1 of 2: repeat-check (the walking skeleton)'},{ag:'architect', say:'Functional Design for repeat-check. The requirements don\'t say what to do when an application has no date of birth, and I won\'t guess. Please answer in <b>functional-design-questions.md</b>.'},{write:P.fdq}],
  body:()=>`<p>Construction works <b>unit by unit</b>. Each unit goes through its design stages and Code Generation before the next one starts.</p><p>Answer the question in the stage card. Fraudsters sometimes leave fields blank on purpose; genuine customers sometimes fill forms in badly.</p>`,
  after:()=>[{fn:()=>{S.lock.b1=true; log(`Answered: missing date of birth, ${b1txt()}`);}},{write:P.frules},{write:P.fspec},
   {rev:'archrev', verdict:'NOT-READY', say:'Construction reviews are adversarial: findings go straight back to the agent.', findings:[['R-01','Minor','rules.md','Doesn\'t say what lenders should understand from ID-VEL-00.',P.frules,'']]},
   {ag:'architect', say:'Fixed: rules.md now says ID-VEL-00 means "unable to check".'},{mod:P.frules},{rev:'archrev', verdict:'READY', say:'Re-checked R-01: resolved.'}]},
 {id:'nfr-read', stage:'nd', also:['nq'], title:'How well must it work?', act:{type:'open', paths:[P.nperf]},
  enter:()=>[{ag:'architect', say:'NFR Requirements and NFR Design for repeat-check: security and performance.'},{write:P.nsec},{write:P.nperf},{write:P.dperf},{rev:'archrev', verdict:'READY', say:'Targets are achievable with the design.'},{sys:'3.4 Infrastructure Design skipped for repeat-check: no new infrastructure.'}],
  body:()=>`<p>The Architect agent set the non-functional requirements and designed how to meet them. The Architecture reviewer passed them.</p><p>In unit-by-unit Construction, the design stages don't each stop for you. You approve the unit's <b>code plan</b> and then the <b>verified unit</b>.</p><p>Open ${fl(P.nperf)}.</p>`},

/* ================= badges, glossary, outcome ================= */
const BADGES = [['profile','🧭','Right-sized','Chose the workflow profile that fits, first time.'],['first','👀','Saw the problem','Ran the product and watched the fraud slip through.'],['constraint','🔎','Constraint spotter','Found the constraint that limits the design, first time.'],['assume','🧩','Assumption checker','Removed an unsourced assumption before the gate.'],['fact','🧐','Fact checker','Caught a wrong fact in the code knowledge base.'],['editor','✏️','Sharp editor','Made a vague acceptance criterion testable.'],['plan','📋','Plan checker','Caught a plan step that broke a requirement.'],['tester','🧪','Edge-case tester','Tried all four applicants in your build.'],['ship','🚀','Shipped','Released the change through the Operation phase.']];
let toastT;
function badge(id, instant){ if (!id||S.badges[id]) return; S.badges[id]=true; if (instant) return; const b=BADGES.find(x=>x[0]===id), t=document.getElementById('toast'); t.textContent=`${b[1]} Badge earned: ${b[2]}`; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; }, 3400); }
const badgesHTML = () => `<b>Badges: ${BADGES.filter(b=>S.badges[b[0]]).length} of ${BADGES.length}</b>`+BADGES.map(b=>`<div class="bcard ${S.badges[b[0]]?'on':''}"><span class="e">${b[1]}</span><div><b>${b[2]}</b><p>${b[3]}</p></div></div>`).join('');
const GLOSS = {'workflow profile':'A ready-made route through the stages for a kind of work, such as feature, bugfix or enterprise. The engine calls it a scope.','approval gate':'The point at the end of a stage where work stops until a person approves it.','verification gate':'An automatic check at the end of a phase that the documents agree with each other.','acceptance criteria':'The conditions that must be true for a story to count as done. Each one should be testable.','non-functional requirements':'How well something must work, such as speed, privacy and security. Not what it does.','reverse engineering':'The stage where an agent reads existing code and writes down how the product works.','walking skeleton':'The smallest slice that works end to end, built and verified before anything else.','construction verification command':'The test command, approved by a person, that every unit must pass at its checkpoint.','practices discovery':'The stage that finds how the team works from the project itself, and turns it into rules.','learning loop':'When you correct an agent, it asks whether to keep the correction for next time.','unit of work':'A piece of the solution that can be built and checked on its own.','plan approval':'Approving the Developer agent\'s code plan before it writes any code.','user stories':'Short descriptions of what a user needs, each with acceptance criteria.','record dir':'The folder that holds everything about one intent: state, audit trail and every stage\'s documents.','reason code':'A short code the product returns to explain part of a risk score.','traceability':'Being able to follow a line from the intent to a requirement, a story, a unit and a passing test.','conductor':'The /aidlc session. It asks the engine what runs next, runs it, and asks you at every gate.','reviewer':'An agent that checks another agent\'s work and writes findings. It never edits the work.','finding':'A problem a reviewer agent raises. At an advisory gate, approving accepts open findings as risk.','codekb':'The code knowledge base Reverse Engineering writes. It is shared by every intent in the space.','brownfield':'A change to a product that already has code.','sensor':'An automatic check that runs on what an agent produces, such as a linter or type check.','intent':'One piece of work, with its own record. It starts with your /aidlc request.','space':'A team\'s area in the workspace, holding its intents, memory and code knowledge base.','bolt':'A planned delivery slice over one or more units, with its own definition of done.','mob':'A small group of people who steer the agents. User Stories can also run as a mob of agents.','personas':'Short descriptions of the people a product is for.'};
const GRE = new RegExp('\\b('+Object.keys(GLOSS).sort((a,b)=>b.length-a.length).join('|')+')\\b','i');
// Underline the first use of each glossary term in the guide, so a learner can hover or tap for its meaning.
function glossify(root){ if (!root) return; const used=new Set(), w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes=[]; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ if (n.parentElement.closest('button,a,code,h2,h3,summary,.k,.chipst')) return; let node=n, m;
    while (node && (m=GRE.exec(node.nodeValue))){ const key=m[1].toLowerCase(), hit=node.splitText(m.index), after=hit.splitText(m[0].length);
      if (!used.has(key)){ used.add(key); const b=document.createElement('button'); b.className='gterm'; b.dataset.term=key; b.textContent=hit.nodeValue; hit.replaceWith(b); }
      node=after; } });
}
function showTip(el){ const tip=document.getElementById('tip'); tip.innerHTML=`<b>${esc(el.dataset.term)}</b><span>${esc(GLOSS[el.dataset.term])}</span>`; tip.hidden=false;
  const r=el.getBoundingClientRect(), w=Math.min(300*remPx()/16, innerWidth-16); tip.style.width=w+'px'; tip.style.left=Math.max(8, Math.min(r.left, innerWidth-w-8))+'px';
  const h=tip.offsetHeight; tip.style.top=(r.bottom+6+h>innerHeight ? r.top-h-6 : r.bottom+6)+'px'; }
const hideTip = () => { document.getElementById('tip').hidden=true; };
/* What happened in production, worked out from the learner's decisions. The figures are made up for training. */
function outcome(){ const w=winKey(), t=thrN(), notes=[];
  let stopped={h24:{3:14,5:6}, d7:{3:34,5:22}, d30:{3:38,5:30}}[w][t];
  notes.push(`A ${win().replace(' days','-day').replace(' hours','-hour')} period with a threshold of ${t} ${stopped>=30?'catches most repeat use of an identity':stopped>=20?'catches the faster fraud rings, and misses slower ones':'misses most of this fraud, which is spread over days'}.`);
  if (batch()){ stopped=Math.round(stopped*.5); notes.push('The check runs overnight, so half the warnings arrived after the loan had been paid out.'); }
  if (!raise()){ stopped=Math.round(stopped*.6); notes.push('The score did not change, so lenders\' automatic systems approved these loans. Only analysts who read the reason code stopped them.'); }
  let fp=matchND()?120:9; if (w==='d30') fp=Math.round(fp*1.6); if (w==='h24') fp=Math.round(fp*.4); if (t===5) fp=Math.round(fp*.3);
  notes.push(matchND()?'Matching on name and date of birth alone flags people who simply share both, like Maria Garcia.':'Matching on name, date of birth and address keeps wrongly flagged customers low.');
  if (S.a.b1==='B'){ stopped=Math.max(0,stopped-3); notes.push('Applications with no date of birth passed silently. Three fraud cases used that gap.'); }
  else if (S.a.b1==='C'){ stopped=Math.min(40,stopped+2); fp+=190; notes.push('Every application with no date of birth was treated as high risk. That stopped two more fraud cases, and flagged 190 genuine customers who had filled the form in badly.'); }
  else notes.push('210 applications came back as "unable to check". Analysts could see the gap, and reviewed them.');
  const banner=S.a.q8==='B', mins=tight()?(banner?2:3):(banner?5:6);
  notes.push(tight()?'The warning shows the count and the time period, so analysts act on it quickly.':'The warning does not say why it fired. Analysts look each one up, and lenders sent 31 support tickets asking what ID-VEL-01 means.');
  return {stopped, total:40, fp, mins, notes};
}
function withAlt(a, ch, fn){ const sa=S.a, sc=S.changes, sf=S.follow; try { S.a={...sa,...a}; S.changes={...sc,...ch}; if ('q1' in a) S.follow=null; return fn(); } finally { S.a=sa; S.changes=sc; S.follow=sf; } }
const outcomeCards = o => `<div class="ocards"><div class="box"><span class="k">Fraud cases stopped</span><div class="big">${o.stopped}</div><p>of ${o.total} attempts of this kind</p></div><div class="box"><span class="k">Genuine customers wrongly flagged</span><div class="big">${o.fp}</div><p>in the month</p></div><div class="box"><span class="k">Analyst time per warning</span><div class="big">${o.mins}</div><p>minutes, on average</p></div></div>`;
function whatIfHTML(){ const me=outcome(), w=winKey();
  const alts=[[w==='d7'?'a 24-hour period':'a 7-day period', w==='d7'?{q1:'A'}:{q1:'B'}, {}],[matchND()?'matching on address as well':'matching on name and date of birth only', {q4:matchND()?'A':'B'}, {}],[batch()?'running the check in real time':'running the check overnight', {q5:batch()?'A':'B'}, {}],[S.a.b1==='B'?'saying "unable to check" for a missing date of birth':'treating a missing date of birth as a pass', {b1:S.a.b1==='B'?'A':'B'}, {}],[tight()?'leaving story 2 vague':'making story 2 testable', {}, {stories:!tight()}]];
  const d=(now,alt,goodUp)=>now===alt?'<span>no change</span>':`<span class="${(alt>now)===goodUp?'up':'dn'}">${alt>now?'▲':'▼'} ${alt} (you: ${now})</span>`;
  return `<div class="wif">${alts.map(([label,a,ch])=>{ const o=withAlt(a,ch,outcome); return `<div><b>With ${label}</b><span class="d">Fraud stopped ${d(me.stopped,o.stopped,true)}</span><span class="d">Wrongly flagged ${d(me.fp,o.fp,false)}</span><span class="d">Minutes per warning ${d(me.mins,o.mins,false)}</span></div>`; }).join('')}</div>`;
}

/* ================= saved progress ================= */
const SAVE_KEY = 'aidlc-v2-lab-progress-2';
// Saved only while idle, so a refresh mid-animation returns to the moment just before that action.
function save(){ if (!S.started || S.busy || S.running || S.typing) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }
function load(){ try { const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if (!d || !d.started || !(d.step>=0 && d.step<STEPS.length) || !d.files) return; S=Object.assign(fresh(), d, {busy:false, running:false, typing:false, lastTarget:''}); S.view=Math.min(S.view, S.step); } catch(e){} }

/* ================= engine ================= */
// v2 audit rows carry ISO timestamps. The lab's clock starts at 09:00 on the day the intent was created.
function clk(){ const m=S.clock%1440; return `2026-11-18T${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}:00Z`; }
function log(text){ S.audit.push({t:clk(), text}); S.clock+=3; }
async function play(ops, instant){ const g=gen;
  for (const op of ops){ if (g!==gen) return false;

// A small Markdown renderer for the documents the agents write. ADD-marked lines are shown as changed.
function inline(s, hls){ let e=esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  (hls||[]).forEach(h=>{ const he=esc(h); if (he&&e.includes(he)) e=e.split(he).join(`<mark class="flag">${he}</mark>`); }); return e; }
function mdHTML(text, hls){ const L=text.split('\n'); let out='', list=null, table=null, pre=null;
  const close=()=>{ if (list){ out+=`</${list}>`; list=null; } if (table){ out+='</table>'; table=null; } if (pre!==null){ out+=`<pre>${pre}</pre>`; pre=null; } };
  L.forEach(raw=>{ const chg=raw[0]===ADD, l=chg?raw.slice(1):raw, cls=chg?' class="chg"':'';
    if (/^    /.test(l)){ if (pre===null){ close(); pre=''; } pre+=esc(l.slice(4))+'\n'; return; }
    if (pre!==null){ out+=`<pre>${pre}</pre>`; pre=null; }
    if (/^\|/.test(l)){ if (/^\|[-| ]+\|$/.test(l)) return; const cells=l.split('|').slice(1,-1).map(c=>c.trim()); if (!table){ close(); table=true; out+='<table>'+`<tr>${cells.map(c=>`<th>${inline(c,hls)}</th>`).join('')}</tr>`; } else out+=`<tr${cls}>${cells.map(c=>`<td>${inline(c,hls)}</td>`).join('')}</tr>`; return; }
    if (table){ out+='</table>'; table=null; }
    let m;
    if ((m=l.match(/^(#{1,3}) (.*)/))){ close(); const n=m[1].length; out+=`<h${n+3}${cls}>${inline(m[2],hls)}</h${n+3}>`; return; }
    if ((m=l.match(/^\s*- (.*)/))||(m=l.match(/^\s*\d+\. (.*)/))){ const t=/^\s*\d+\./.test(l)?'ol':'ul'; if (list!==t){ close(); list=t; out+=`<${t}>`; } out+=`<li${cls}>${inline(m[1],hls)}</li>`; return; }
    if (!l.trim()){ close(); return; }
    close(); out+=`<p${cls}>${inline(l,hls)}</p>`; });
  close(); return out; }
function docHTML(p, hls){ const f=FILES[p]; if (!f) return '';
  if (f.lang==='q') return `<div class="qform">${f.lines().map(l=>`<div class="ql ${l.add?'chg':''}">${l.h!==undefined?l.h:hl(l.t,'md')||'&nbsp;'}</div>`).join('')}</div>`;
  if (f.lang==='md') return `<div class="mdoc">${mdHTML(f.gen(), hls)}</div>`;
  return `<pre class="cv">${f.gen().split('\n').map(t=>{ const a=t[0]===ADD, s=a?t.slice(1):t; let h=hl(s, f.lang==='py'?'py':''); (hls||[]).forEach(x=>{ const xe=esc(x); if (xe&&h.includes(xe)) h=h.split(xe).join(`<mark class="flag">${xe}</mark>`); }); return `<span class="${a?'chg':''}">${h||' '}</span>`; }).join('\n')}</pre>`; }
const findsFor = p => (S.finds||[]).filter(f=>f.file===p);
function cardHTML(){ const st=STEPS[S.view], sg=STAGES[SI[st.stage]], grp=[...(st.also||[]).map(id=>STAGES[SI[id]]), sg];
  if (sg.id==='setup') return `<div class="scard"><div class="sch"><span class="chipst">Before you start</span><h2>The stage card</h2></div><p>As the agents work, this card shows the stage you are in: which agent leads it, what it produced, and the one document worth reading, with any reviewer findings beside it.</p>${S.path&&S.files[S.path]?readerHTML(S.path):needHTML()}</div>`;
  const outs=grp.flatMap(g=>g.outs).filter(p=>S.files[p]), made=grp.flatMap(g=>(g.outs.length&&S.files[g.outs[g.outs.length-1]])||SI[g.id]<curStage()||S.done||(g.skip&&g.skip()&&S.step>STEPS.findIndex(x=>x.stage===g.id||(x.also||[]).includes(g.id)))?(MADE[g.id]||[]):[]);
  return `<div class="scard"><div class="sch"><span class="sav" style="color:var(--ag-${sg.lead})">${botSVG(sg.lead, 36)}</span><div><span class="chipst">${sg.id==='init'?'Initialization · stages 0.1 to 0.3':`Stage${grp.length>1?'s':''} ${grp.map(g=>g.n).join(' and ')} · ${sg.phase}`}</span><h2>${grp.map(g=>g.name).join(', and ')}</h2><p class="muted">${grp.map(g=>`${g.n&&g.n!=='0'?g.n+' ':''}Lead: ${AG[g.lead].n}${g.rev?` · Reviewer: ${AG[g.rev].n}`:''}`).join('<br>')}</p></div></div>
   <div class="made"><span class="k">What the agent${grp.length>1?'s':''} produced</span>${made.length?`<ul>${made.map(t=>`<li>${t}</li>`).join('')}</ul>`:'<p class="muted">Nothing yet. Watch the conversation as the agents work.</p>'}</div>
   ${needHTML()}${S.path&&S.files[S.path]?readerHTML(S.path):''}
   ${outs.length?`<details class="fw"><summary><span class="k">Files written · ${outs.length}</span></summary><div class="fwl">${outs.map(p=>`<button class="flink" data-open="${p}">${fname(p)}</button>`).join('')}</div></details>`:''}
   <p class="ypart"><b>Your part.</b> ${sg.you}</p></div>`; }
function needHTML(){ const need=needPaths(); return need.length?`<div class="needbox"><span class="k">To read for this step</span>${need.map(p=>`<button class="pcard need" data-open="${p}"><b>📄 ${fname(p)}</b><span>${esc(fileAbout(p))}</span><em>Open ›</em></button>`).join('')}</div>`:''; }
function readerHTML(p){ const fs=findsFor(p), open=fs.filter(f=>!f.done);
  return `<div class="reader"><div class="rh"><span class="k">Reading · ${fname(p)}</span>${S.files[p].state==='mod'?'<span class="tag">changed</span>':''}</div><p class="muted rab">${esc(fileAbout(p))}</p>${docHTML(p, open.map(f=>f.hl).filter(Boolean))}
   ${fs.map(f=>`<div class="fnote ${f.done?'ok':''}"><b>${f.id} · ${f.sev}</b> ${esc(f.text)}<span>${f.done?'Resolved':AG[f.rv].n}</span></div>`).join('')}</div>`; }

/* ---------- the lifecycle modal ---------- */
function lcDone(){ return Math.min(33, S.appr||0); }
function ringSVG(done, total, size){ const r=size/2-3, L=2*Math.PI*r, f=done/total; return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" class="rbg" stroke-width="3"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" class="rfg" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(f*L).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`; }
function lcHTML(){ const cs=curStage(), nowIds=[STEPS[S.step].stage,...(STEPS[S.step].also||[])], vs=SI[STEPS[S.view].stage];
  const gate=ph=>{ const last=Math.max(...STAGES.map((s,i)=>s.phase===ph?i:-1)); return S.done||cs>last?'<div class="lgate ok">✓ Verification gate passed</div>':'<div class="lgate">Verification gate</div>'; };
  const col=ph=>{ const list=STAGES.map((s,i)=>[s,i]).filter(([s])=>s.phase===ph); const dn=list.filter(([s,i])=>S.done||i<cs&&!nowIds.includes(s.id)).length;
    return `<div class="lcol"><span class="k">${ph} · ${dn}/${list.length}</span>${list.map(([s,i])=>{ const now=!S.done&&nowIds.includes(s.id), sk=!!(s.skip&&(S.done||i<cs)), d=!now&&(S.done||i<cs);
      return `<button class="lt ${sk?'skip':d?'done':now?'now':''} ${i===vs&&!now?'view':''}" data-stage="${i}"><span class="ltn"><b>${s.n&&s.n!=='0'?s.n+' ':''}${s.name}</b>${now?'<em>You are here</em>':sk?'<em class="sk">Skipped</em>':d?'<i>✓</i>':s.skip?'<em class="sk">May skip</em>':''}</span><small>${AG[s.lead].n}${s.rev?' · reviewed':''}</small></button>`; }).join('')}${['Ideation','Inception','Construction'].includes(ph)?gate(ph):''}</div>`; };
  return `<div class="lcm-card" role="dialog" aria-modal="true" aria-labelledby="lc-h"><div class="lch">${ringSVG(lcDone(),33,30)}<h2 id="lc-h">The lifecycle · feature profile</h2><span class="muted">${S.done?'All 33 stages done':`${lcDone()} of 33 stages done · you are at ${STAGES[cs].n&&STAGES[cs].n!=='0'?STAGES[cs].n+' ':''}${STAGES[cs].name}`}</span><button class="btn" data-act="lcclose" style="margin-left:auto">Close ✕</button></div>
   <div class="lgrid">${['Initialization','Ideation','Inception','Construction','Operation'].map(col).join('')}</div>
   <div class="lfoot"><div class="loop">↺ Feedback from 4.7 Feedback & Optimization starts the next intent at 1.1</div><span class="muted">Click a stage you have reached to re-read it.</span></div></div>`; }
function openLC(){ const m=document.getElementById('lcm'); m.innerHTML=lcHTML(); m.hidden=false; hideTip(); document.getElementById('pop').hidden=true; const b=m.querySelector('[data-act="lcclose"]'); if (b) b.focus(); }
function closeLC(){ const m=document.getElementById('lcm'); if (!m.hidden){ m.hidden=true; m.innerHTML=''; const b=document.getElementById('btn-lc'); if (b) b.focus(); } }

// Network updates for each message: who is working, who handed what to whom, and when it is your turn.
function netHooks(op){
  if (op.ag){ netAct(op.ag, op.st||'working'); netEdge('conductor', op.ag, 'hand'); }
  else if (op.rev){ const v=op.verdict==='READY'?'ready':op.verdict==='NOT-READY'?'not ready':'concerns'; netAct(op.rev, v); netEdge(op.rev,'conductor','rev');
    const ld=STAGES[curStage()].lead; S.msgs.push({who:'hand', a:ld, b:op.rev, text:'handed the work for review'});
    const st=STEPS[S.step].stage; if (op.verdict==='READY') (S.finds||[]).forEach(f=>{ if (f.st===st&&f.rv===op.rev) f.done=true; });
    (op.findings||[]).forEach(([id,sev,where,text,file,hl])=>{ S.finds=S.finds||[]; if (!S.finds.some(f=>f.st===st&&f.id===id&&f.rv===op.rev)) S.finds.push({st, rv:op.rev, id, sev, where, text, file:file||null, hl:hl||'', done:false}); }); }
  else { netAct('conductor', op.ask?'waiting':'routing'); if (op.ask){ netAct('you','your decision'); netEdge('conductor','you','you'); } }
}
const resolveFind = (st, id) => (S.finds||[]).forEach(f=>{ if (f.st===st&&f.id===id) f.done=true; });

/* ================= events ================= */
document.addEventListener('click', e=>{ const t=e.target; const c=s=>t.closest(s); let x;
  const pop=document.getElementById('pop'), was=pop.hidden?'':pop.dataset.kind;
  if ((x=c('.gterm'))){ showTip(x); return; }
  hideTip();
  if ((x=c('[data-jump]'))){ pop.hidden=true; jumpTo(+x.dataset.jump); return; }
  if (!c('#pop')) pop.hidden=true;
  if ((x=c('[data-stp]'))){ stPage=+x.dataset.stp; renderStart(); return; }
  if (c('#go')||c('#go-skip')){ start(); return; }
  if (c('#btn-help')){ openHelp(); return; }
  if (c('[data-act="closehelp"]')){ closeHelp(); return; }
  if (c('#zoom-in')){ setZoom(zoomI+1); return; }
  if (c('#zoom-out')){ setZoom(zoomI-1); return; }
  if (c('#zoom-reset')){ setZoom(ZOOMS.indexOf(1)); return; }
  if (c('#btn-restart')||c('#again')){ restart(); return; }
  if (c('#btn-lc')){ openLC(); return; }
  if (c('[data-act="lcclose"]')||t.id==='lcm'){ closeLC(); return; }
  if (c('#btn-badges')){ if (was!=='badges'){ pop.dataset.kind='badges'; pop.innerHTML=badgesHTML(); pop.hidden=false; } return; }
  if (!S.started) return;
  
  if ((x=c('[data-close]'))){ closeTab(x.dataset.close); return; }
  if ((x=c('[data-dir]'))){ S.col[x.dataset.dir]=!S.col[x.dataset.dir]; renderAll(); return; }
  if (c('#colall')){ const dirs=new Set(); Object.keys(S.files).forEach(p=>{ const a=p.split('/'); for (let i=1;i<a.length;i++) dirs.add(a.slice(0,i).join('/')+'/'); }); const any=Object.values(S.col).some(Boolean); S.col={}; if (!any) dirs.forEach(d=>S.col[d]=true); renderAll(); return; }
  if ((x=c('[data-open]'))){ openFile(x.dataset.open); return; }
  if ((x=c('[data-q]'))){ answer(x.dataset.q, x.dataset.v); return; }
  if ((x=c('[data-center]'))){ S.center=x.dataset.center; renderAll(); return; }
  if ((x=c('#mnav [data-pane]'))){ S.pane=x.dataset.pane; renderAll(); return; }
  if ((x=c('[data-sel]'))){ S.sel=x.dataset.sel; renderAll(); return; }
  if ((x=c('[data-pv]'))){ S.pv=x.dataset.pv; renderAll(); return; }
  if ((x=c('[data-chip]'))){ pick(+x.dataset.chip); return; }
  if ((x=c('[data-pick]'))){ const st=STEPS[S.step]; if (S.view!==S.step||st.act.type!=='choose') return; const firstTry=S.ch[st.id]===undefined; S.ch[st.id]=+x.dataset.pick; if (ready(st)&&firstTry) badge({plan:'profile','fe-quiz':'constraint'}[st.id]); renderAll(); return; }
  if ((x=c('[data-stage]'))){ pop.hidden=true; closeLC(); const i=+x.dataset.stage, first=STEPS.findIndex((s,k)=>(s.stage===STAGES[i].id||(s.also||[]).includes(STAGES[i].id))&&live(k));
    if (first<0){ pop.dataset.kind='jump'; pop.innerHTML=`<b>${STAGES[i].n} ${STAGES[i].name}</b><p>${i<curStage()||S.done?STAGES[i].why:'The feature profile includes this stage, but it is conditional. It skips itself when the work does not need it.'}</p><p style="color:var(--muted)">Lead: ${AG[STAGES[i].lead].n}.</p>`; pop.hidden=false; }
    else if (first<=S.step){ S.view=Math.min(first,S.step); if (i===curStage()) S.view=S.step; renderAll(); }
    else if (S.busy){ pop.dataset.kind='jump'; pop.innerHTML='<p>Wait for the AI to finish, then try again.</p>'; pop.hidden=false; }
    else { pop.dataset.kind='jump'; pop.innerHTML=`<b>Jump ahead to ${STAGES[i].name}?</b><p style="color:var(--muted)">The steps in between will be completed for you with typical answers.</p><div style="display:flex;gap:0.5rem"><button class="btn primary" data-jump="${first}">Jump ahead</button><button class="btn" data-act="closepop">Cancel</button></div>`; pop.hidden=false; }
    return; }
  if ((x=c('[data-act]'))){ const a=x.dataset.act;
    if (a==='next'){ if (!S.busy&&S.view===S.step&&ready(STEPS[S.step])) next(); }
    else if (a==='send') send(); else if (a==='run') runAssess();
    else if (a==='closepop') pop.hidden=true;
    else if (a==='gloss'){ if (was!=='gloss'){ pop.dataset.kind='gloss'; pop.innerHTML='<b>Glossary</b><dl class="gl">'+Object.keys(GLOSS).sort().map(k=>`<div><dt>${k}</dt><dd>${esc(GLOSS[k])}</dd></div>`).join('')+'</dl>'; pop.hidden=false; } }
    else if (a==='back'){ S.view=seek(S.view,-1); renderAll(); } else if (a==='fwd'){ S.view=seek(S.view,1); renderAll(); } else if (a==='current'){ S.view=S.step; renderAll(); }
  }
});

document.addEventListener('mouseout', e=>{ if (e.target.closest&&e.target.closest('.gterm')) hideTip(); });
document.addEventListener('focusin', e=>{ if (e.target.classList&&e.target.classList.contains('gterm')) showTip(e.target); });
document.addEventListener('focusout', e=>{ if (e.target.classList&&e.target.classList.contains('gterm')) hideTip(); });
document.addEventListener('toggle', e=>{ if (e.target.classList&&e.target.classList.contains('outsd')) S.outsOpen=e.target.open; }, true);
document.addEventListener('keydown', e=>{ if (e.target.closest&&e.target.closest('.split')) return;
  if (!S.started||helpOpen){ const n=startPages().length; if (e.key==='Escape'&&helpOpen){ closeHelp(); return; } if (e.key==='?'&&helpOpen){ closeHelp(); return; }
    if (e.key==='ArrowRight'&&stPage<n-1){ stPage++; renderStart(); } else if (e.key==='ArrowLeft'&&stPage>0){ stPage--; renderStart(); } return; }
  if (e.key==='?'&&!e.target.closest('input,textarea')){ e.preventDefault(); openHelp(); return; }
  if (e.key==='Escape'){ document.getElementById('pop').hidden=true; hideTip(); closeLC(); return; } if (!S.started||e.target.closest('select')) return; if (e.key==='ArrowRight'){ if (S.view<S.step){ S.view=seek(S.view,1); renderAll(); } else if (!S.busy){ const st=STEPS[S.step]; if (st.act.type==='prompt') send(); else if (ready(st)) next(); } } else if (e.key==='ArrowLeft'&&S.view>0){ S.view=seek(S.view,-1); renderAll(); } });

const isDark = () => { const t=document.documentElement.dataset.theme; return t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
const themeLabel = () => { const d=isDark(); document.getElementById('theme-txt').textContent = d ? 'Light mode' : 'Dark mode'; document.getElementById('btn-theme').dataset.mode = d ? 'dark' : 'light'; };
try { const t=localStorage.getItem('aidlc-lab-theme'); if (t==='dark'||t==='light') document.documentElement.dataset.theme=t; } catch(e){}
// The blade retracts into the hilt, the theme changes, then the blade comes back in the new colour.
let sheathing=false;
document.getElementById('btn-theme').addEventListener('click', e=>{ if (sheathing) return; const b=e.currentTarget; sheathing=true; b.classList.add('sheath');
  setTimeout(()=>{ const t=isDark()?'light':'dark'; document.documentElement.dataset.theme=t; try { localStorage.setItem('aidlc-lab-theme', t); } catch(e){} themeLabel(); b.classList.remove('sheath'); sheathing=false; }, reduce?0:300); });
themeLabel();
/* The three panels can be resized by dragging the handles between them. Widths are remembered in this browser. */
const mainEl=document.querySelector('.main'), PKEY='aidlc-v2-lab-panes';
const remPx = () => parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
const paneW = side => Math.round(document.getElementById(side==='l'?'pane-guide':'pane-ws').getBoundingClientRect().width);
// l and r are in rem.
function setPanes(l, r, keep){ [['--wl',l],['--wr',r]].forEach(([k,v])=>{ if (v) mainEl.style.setProperty(k, v+'rem'); else mainEl.style.removeProperty(k); });
  if (!keep) try { if (l||r) localStorage.setItem(PKEY, JSON.stringify({l,r})); else localStorage.removeItem(PKEY); } catch(e){} }
function resizePane(side, w){ const u=remPx(), room=mainEl.clientWidth-(40+300)*u/16-paneW(side==='l'?'r':'l'); w=Math.max(230*u/16, Math.min(w, room)); const toRem=x=>+(x/u).toFixed(3); setPanes(toRem(side==='l'?w:paneW('l')), toRem(side==='r'?w:paneW('r'))); }
try { const d=JSON.parse(localStorage.getItem(PKEY)||'null'); if (d) setPanes(+d.l||0, +d.r||0, true); } catch(e){}
document.querySelectorAll('.split').forEach(sp=>{ const side=sp.dataset.side, dir=side==='l'?1:-1;
  sp.addEventListener('pointerdown', e=>{ e.preventDefault(); sp.setPointerCapture(e.pointerId); const x0=e.clientX, w0=paneW(side); sp.classList.add('drag'); document.body.classList.add('resizing');
    const mv=ev=>resizePane(side, w0+dir*(ev.clientX-x0)), up=()=>{ sp.classList.remove('drag'); document.body.classList.remove('resizing'); sp.removeEventListener('pointermove',mv); sp.removeEventListener('pointerup',up); sp.removeEventListener('pointercancel',up); };
    sp.addEventListener('pointermove',mv); sp.addEventListener('pointerup',up); sp.addEventListener('pointercancel',up); });
  sp.addEventListener('keydown', e=>{ if (e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return; e.preventDefault(); e.stopPropagation(); resizePane(side, paneW(side)+dir*(e.key==='ArrowRight'?1.5:-1.5)*remPx()); });
  sp.addEventListener('dblclick', ()=>setPanes(0,0));
});
function fitTop(){}
addEventListener('resize', fitTop);
/* Size buttons. They multiply the automatic size, which still follows the screen. Remembered in this browser. */
const ZOOMS=[0.8,0.9,1,1.1,1.2,1.3,1.45,1.6,1.8,2], ZKEY='aidlc-lab-zoom-2';
let zoomI=ZOOMS.indexOf(1);
function setZoom(i, keep){ zoomI=Math.max(0, Math.min(ZOOMS.length-1, i)); const z=ZOOMS[zoomI];
  if (z===1) document.documentElement.style.removeProperty('--uz'); else document.documentElement.style.setProperty('--uz', z);
  document.getElementById('zoom-reset').textContent=Math.round(z*100)+'%';
  document.getElementById('zoom-out').disabled=zoomI===0; document.getElementById('zoom-in').disabled=zoomI===ZOOMS.length-1;
  fitTop();
  if (!keep) try { if (z===1) localStorage.removeItem(ZKEY); else localStorage.setItem(ZKEY, z); } catch(e){} }
try { const z=parseFloat(localStorage.getItem(ZKEY)); setZoom(ZOOMS.includes(z)?ZOOMS.indexOf(z):zoomI, true); } catch(e){ setZoom(zoomI, true); }
S=fresh(); load(); renderAll();
</script>
</body>
</html>
