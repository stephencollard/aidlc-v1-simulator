<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-DLC v1 Learning Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a calm three-panel studio. Lesson guide on the left, the project (files or the running app) in the middle, the AI assistant on the right. One red-outlined panel at a time shows where to look. */
  --bg:#ECEDEF; --panel:#FFFFFF; --panel2:#F5F6F7; --ink:#1B1D21; --muted:#5F656D; --line:#DADDE1;
  --accent:#C2202B; --soft:#FBE9EA; --po:#C0262D; --eng:#1F5FBF; --pm:#0F7B6C; --ux:#7A3EB1; --arch:#B4540A; --good:#2B7D3B; --warn:#A8650A; --bar:#1B1D21;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1013; --panel:#191B1F; --panel2:#1F2227; --ink:#ECEEF1; --muted:#9BA1A9; --line:#2D3138;
  --accent:#F0595F; --soft:#3A1F22; --po:#F07075; --eng:#7EA8F0; --pm:#4FC1AE; --ux:#B892E8; --arch:#F0A35E; --good:#6CC17A; --warn:#E0B04F; --bar:#08090A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1013; --panel:#191B1F; --panel2:#1F2227; --ink:#ECEEF1; --muted:#9BA1A9; --line:#2D3138;
  --accent:#F0595F; --soft:#3A1F22; --po:#F07075; --eng:#7EA8F0; --pm:#4FC1AE; --ux:#B892E8; --arch:#F0A35E; --good:#6CC17A; --warn:#E0B04F; --bar:#08090A; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.2}
.k{font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.top{background:var(--bar);color:#F1F2F3;display:flex;align-items:center;gap:18px;padding:8px 14px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:7px;background:#C2202B;display:grid;place-items:center;font:700 12px/1 var(--mono);font-style:normal;color:#fff}
.stepper{flex:1;display:flex;align-items:flex-end;gap:10px;min-width:0;overflow-x:auto;padding:2px 0}
.ph{display:flex;flex-direction:column;gap:4px}
.ph .pn{font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(241,242,243,.55)}
.ph .ds{display:flex;gap:3px}
.dot{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 11.5px/1 var(--mono);color:rgba(241,242,243,.6);border:1.5px solid rgba(241,242,243,.28)}
.dot.done{background:#2B7D3B;border-color:#2B7D3B;color:#fff}
.dot.now{background:#C2202B;border-color:#C2202B;color:#fff;box-shadow:0 0 0 4px rgba(194,32,43,.35)}
.dot.view{outline:2px solid #fff;outline-offset:2px}
.dot.skip{border-style:dashed;color:rgba(241,242,243,.5)}
.now-name{font-size:13.5px;color:rgba(241,242,243,.85);white-space:nowrap;align-self:center}
.tools{display:flex;align-items:center;gap:8px}
.tb{all:unset;cursor:pointer;font:500 13px/1 var(--sans);padding:8px 10px;border-radius:8px;border:1px solid rgba(241,242,243,.25);white-space:nowrap}
.tb:hover{background:rgba(241,242,243,.1)}
.tb[aria-pressed="true"]{background:#F1F2F3;color:#1B1D21}
#btn-theme{display:inline-flex;align-items:center;gap:9px}
.saber{display:inline-flex;flex-direction:column;align-items:center;margin:-5px 0;--sc:#FF3B45}
#btn-theme[data-mode="dark"] .saber{--sc:#3D9BFF}
.saber .blade{width:3px;height:15px;border-radius:2px 2px 0 0;background:var(--sc);box-shadow:0 0 4px 1px var(--sc),0 0 9px 1px color-mix(in srgb,var(--sc) 55%,transparent);transform-origin:50% 100%;transition:transform .28s ease-in}
#btn-theme.sheath .blade{transform:scaleY(0)}
.saber .hilt{width:5px;height:7px;border-radius:1px 1px 2px 2px;background:linear-gradient(#C9CDD3 0 2px,#7D838C 2px 3px,#A4A9B1 3px)}

.pop{position:absolute;right:14px;top:54px;z-index:40;width:min(380px,calc(100vw - 28px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:14px;display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto}
.bcard{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid var(--line);opacity:.5}
.bcard.on{opacity:1;background:var(--soft);border-color:var(--accent)}
.bcard span.e{font-size:22px;line-height:1}.bcard:not(.on) span.e{filter:grayscale(1)}
.bcard p{font-size:13px;color:var(--muted)}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:60;background:var(--bar);color:#fff;padding:10px 16px;border-radius:999px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2)}

/* main grid */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr) minmax(290px,370px);gap:10px;padding:10px}
body.inst .main{grid-template-columns:minmax(340px,440px) minmax(0,1fr) minmax(290px,360px)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;transition:box-shadow .2s}
.pane.attn,.composer.attn{box-shadow:0 0 0 3px var(--accent)}
.pane.working{box-shadow:0 0 0 3px color-mix(in srgb,var(--muted) 55%,transparent)}
.phd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.phd h2{font-size:13px;font-weight:600;letter-spacing:.02em}
.scroll{flex:1;min-height:0;overflow-y:auto}

/* guide */
.g-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
body.inst .g-body{font-size:17px}
.chipst{display:inline-flex;gap:6px;align-items:center;font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.g-body h2{font-size:24px;font-weight:700}
.g-body h3{font-size:17px;font-weight:600}
.sdots{display:flex;gap:5px;align-items:center}
.sdots i{width:22px;height:5px;border-radius:9px;background:var(--line)}
.sdots i.d{background:var(--good)}.sdots i.c{background:var(--accent)}
.g-body p{max-width:62ch}
.g-body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.idea{border-left:4px solid var(--accent);background:var(--soft);border-radius:0 10px 10px 0;padding:10px 12px}
.idea b{display:block;font:600 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.outs{list-style:none;padding:0!important;gap:4px!important}
.outs li{display:flex;gap:8px;align-items:center;font:13px/1.4 var(--mono)}
.outs .tk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:11px;flex:0 0 auto}
.outs li.w .tk{background:var(--good);border-color:var(--good);color:#fff}
.flink{all:unset;cursor:pointer;font-family:var(--mono);font-size:.9em;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.role{border-left:4px solid var(--rc);padding:2px 0 2px 12px}
.role b{color:var(--rc)}
.opt{all:unset;cursor:pointer;display:block;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.opt:hover{border-color:var(--muted)}
.opt.no{border-color:var(--warn)}.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--panel))}
.fb{font-size:.92em;margin-top:6px;display:block}
.opt.no .fb{color:var(--warn)}.opt.ok .fb{color:var(--good)}
.g-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
.move{display:flex;gap:10px;align-items:center}
.move .lab{flex:0 0 auto;font:700 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#fff;padding:6px 8px;border-radius:6px}
.move .lab.wait{background:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px;font-weight:500}
.navrow{display:flex;gap:6px;align-items:center;justify-content:space-between}

/* workspace */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}
.seg{flex:0 0 auto}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font:500 13px/1 var(--sans);white-space:nowrap}
.phd h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg.sm button{padding:5px 9px;font-size:12px}
.wsb{flex:1;min-height:0;display:grid;grid-template-columns:230px minmax(0,1fr)}
.exp{border-right:1px solid var(--line);background:var(--panel2);overflow-y:auto;padding:8px 6px 16px;font:13px/1.35 var(--mono)}
.exp .root{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px 8px}
.dir{color:var(--muted);padding:4px 8px;white-space:nowrap}
.frow{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;width:100%;box-sizing:border-box;white-space:nowrap}
.frow:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.frow.cur{background:color-mix(in srgb,var(--ink) 11%,transparent);font-weight:600}
.frow .nm{overflow:hidden;text-overflow:ellipsis}
.frow .mk{margin-left:auto;font:600 10px/1 var(--mono);padding:2px 4px;border-radius:4px}
.mk.n{background:var(--good);color:#fff}.mk.m{background:var(--warn);color:#fff}
.frow.need{box-shadow:inset 0 0 0 2px var(--accent);background:var(--soft);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}}
.ed{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel2);flex:0 0 auto}
.tab{all:unset;cursor:pointer;font:12.5px/1 var(--mono);padding:9px 12px;border-right:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.tab.cur{background:var(--panel);color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
.about{flex:0 0 auto;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.about .p{font:12px/1.3 var(--mono);color:var(--muted)}
.code{flex:1;min-height:0;overflow:auto;padding:10px 0 30px;font:13.5px/1.65 var(--mono)}
.ln{display:flex}
.ln .no{flex:0 0 44px;text-align:right;padding-right:12px;color:color-mix(in srgb,var(--muted) 60%,transparent);user-select:none}
.ln .tx{flex:1;white-space:pre-wrap;word-break:break-word;padding-right:14px;min-height:1.65em}
.ln.add{background:color-mix(in srgb,var(--good) 13%,transparent)}
.ln.add .no{color:var(--good)}
.t-h{font-weight:600;color:var(--accent)}.t-c{color:var(--muted);font-style:italic}.t-s{color:var(--pm)}.t-k{color:var(--eng);font-weight:500}.t-ok{color:var(--good);font-weight:600}.t-code{background:var(--panel2);border-radius:4px;padding:0 3px}
.optline{all:unset;cursor:pointer;display:inline-block;padding:1px 10px;border-radius:6px;border:1.5px solid var(--line);margin:1px 0}
.optline:hover{border-color:var(--accent)}
.optline.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.optline:disabled{cursor:default;opacity:.75}
.own{font:600 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:5px;color:#fff;background:var(--rc)}
:root[data-theme="dark"] .own{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .own{color:#111}}
.empty{flex:1;display:grid;place-items:center;color:var(--muted);padding:30px;text-align:center}

/* app preview */
.pv{flex:1;min-height:0;overflow:auto;padding:16px;background:var(--panel2)}
.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);max-width:980px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.bbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.bbar .d3{display:flex;gap:5px}.bbar .d3 i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.url{flex:1;font:12px/1 var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apph{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.apph b{font-size:17px}
.ver{font:500 12px/1 var(--mono);padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ver.new{border-color:var(--good);color:var(--good)}
.appg{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:0}
.people{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.person{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.person.sel{border-color:var(--ink);background:var(--panel2)}
.person small{color:var(--muted);font-size:12.5px}
.person.need{border-color:var(--accent);animation:pulse 1.5s ease-in-out infinite}
.res{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.outcome{display:flex;flex-wrap:wrap;gap:18px;align-items:center;border-top:1px dashed var(--line);padding-top:14px}
.gauge{flex:0 0 180px;text-align:center}
.gauge .num{font:700 40px/1 var(--mono);margin-top:-46px}
.band{font:700 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.codes{flex:1 1 260px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rc{display:flex;gap:8px;align-items:baseline;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
.rc code{font:600 12px/1.4 var(--mono);white-space:nowrap}
.rc.warn{border-color:var(--accent);background:var(--soft)}.rc.warn code{color:var(--accent)}
.rc.info{border-color:var(--warn)}.rc.info code{color:var(--warn)}
.why{font-size:13.5px;color:var(--muted)}
pre.json{margin:8px 0 0;background:var(--panel2);border-radius:8px;padding:10px;font:12.5px/1.5 var(--mono);overflow:auto}
details summary{cursor:pointer;font-size:13.5px;color:var(--muted)}

/* chat */
.chat{padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:94%;padding:9px 12px;border-radius:12px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.m.ai{background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.m.ai.ask{border:1.5px solid var(--rc,var(--accent))}
.m.me{background:var(--ink);color:var(--panel);align-self:flex-end;border-top-right-radius:4px}
.m.term{background:#0E0F11;color:#D6D9DD;font:12px/1.6 var(--mono);white-space:pre;overflow-x:auto;align-self:stretch;max-width:100%}
.m.term .p{color:#6CC17A}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.composer{flex:0 0 auto;border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel2);margin:0;transition:box-shadow .2s}
.sugg{border:1px dashed var(--muted);border-radius:10px;padding:8px 10px;background:var(--panel);font-size:14px;max-height:130px;overflow:auto}
.hintc{color:var(--muted);font-size:13.5px}
.chipb{text-align:left}

/* summary */
.sumv{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.big{font:700 44px/1 var(--mono);color:var(--accent)}

/* start overlay */
.veil{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bar) 72%,transparent);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;overflow:auto}
.startc{background:var(--panel);border-radius:18px;max-width:780px;width:100%;padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.4);max-height:100%;overflow:auto}
.startc h1{font-size:clamp(26px,4vw,36px)}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pk{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px}
.pk small{color:var(--muted)}
.pk[aria-pressed="true"]{border-color:var(--c,var(--ink));background:var(--panel2)}
.pk[aria-pressed="true"] b{color:var(--c,var(--ink))}

.mnav{display:none}
@media (max-width:1180px){.now-name,.ph .pn{display:none}.wsb{grid-template-columns:190px minmax(0,1fr)}}
@media (max-width:980px){
  .main{grid-template-columns:1fr!important;padding:8px}
  .main>.pane{display:none}
  body[data-pane="guide"] #pane-guide,body[data-pane="ws"] #pane-ws,body[data-pane="ai"] #pane-ai{display:flex}
  .mnav{display:flex;flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel)}
  .mnav button{all:unset;cursor:pointer;flex:1;text-align:center;padding:12px 4px;font-weight:600;font-size:14px;color:var(--muted)}
  .mnav button[aria-pressed="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
  .mnav button.dotme::after{content:" ●";color:var(--accent)}
  .tools .tb.hide-s{display:none}.brand span{display:none}
  .wsb{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .exp{max-height:150px;border-right:none;border-bottom:1px solid var(--line)}
  .appg{grid-template-columns:1fr}.people{border-right:none;border-bottom:1px solid var(--line)}
  .pick{grid-template-columns:1fr}.pick.two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- v2 additions ---- */
.tab{all:unset;display:flex;align-items:center;border-right:1px solid var(--line);color:var(--muted);flex:0 0 auto}
.tab .tn{all:unset;cursor:pointer;font:12.5px/1 var(--mono);padding:9px 4px 9px 12px;white-space:nowrap}
.tab .tx{all:unset;cursor:pointer;font:15px/1 var(--mono);width:20px;height:20px;display:grid;place-items:center;border-radius:5px;margin-right:6px;color:var(--muted)}
.tab .tx:hover{background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink)}
.tab.cur{background:var(--panel);color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
.tab .tn:focus-visible,.tab .tx:focus-visible,.dir:focus-visible,.colall:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sleep = ms => new Promise(r=>setTimeout(r, reduce?Math.min(ms,40):ms));
const ADD = '\u0001';
const ROLES = {po:'Product Owner', ux:'UX Designer', arch:'Architect', eng:'Software Engineer', pm:'Project Manager'};
const NAMES = {po:'Priya', ux:'Mei', arch:'Tomas', eng:'Sam', pm:'Jordan'};
let S, gen = 0;
function fresh(keep){ return {started:false, col:{}, inst:keep?keep.inst:false, step:0, view:0, busy:false, a:{}, ch:{}, used:{}, files:{}, tabs:[], path:null, center:'files', msgs:[], typing:false, badges:{}, opened:{}, stepOpened:{}, build:0, build2:0, built:false, sLock:false, bLock:false, pv:'after', sel:'riley', res:null, runs:{}, running:false, audit:[], clock:540, follow:null, qLock:false, fLock:false, changes:{}, done:false, pane:'guide', lastTarget:''}; }

/* ================= decisions ================= */
const QS = [
 {id:'q1', owner:'po', text:'Over what time period should repeat applications count?', opts:{A:'24 hours',B:'7 days',C:'30 days'}},
 {id:'q2', owner:'po', text:'How many applications in that period should count as suspicious?', opts:{A:'3 or more',B:'5 or more',C:'Let each lender set their own number (default 3)'}},
 {id:'q3', owner:'po', text:'What should happen when the check is triggered?', opts:{A:'Raise the risk score and add a reason code',B:'Add a reason code only, and leave the score unchanged'}},
 {id:'q4', owner:'po', text:'What counts as "the same identity"?', opts:{A:'Name, date of birth and address together',B:'Name and date of birth only'}},
 {id:'q8', owner:'ux', text:'How should the warning appear to a fraud analyst in the console?', opts:{A:'As a highlighted reason code in the list',B:'As a banner above the result, plus the reason code'}},
 {id:'q5', owner:'arch', text:'When should the check run?', opts:{A:'In real time, during every risk assessment',B:'Overnight, in a batch'}},
 {id:'q6', owner:'eng', text:'How much extra time may the check add to an assessment?', opts:{A:'Under 200 milliseconds',B:'Under 1 second'}},
 {id:'q7', owner:'pm', text:'Is there a date this must be live by?', opts:{A:'Yes, the end-of-quarter customer release',B:'No fixed date'}}
];
const SQ = {id:'s1', owner:'po', text:'How should the stories be organised?', opts:{A:'Around each persona: who needs what',B:'Around each feature of the check'}};
const BQ = {id:'b1', owner:'po', text:'Error handling. An application sometimes arrives with no date of birth, so the check cannot match the identity. The requirements do not say what should happen. What should the check do?', opts:{A:'Return a reason code that says "unable to check"',B:'Treat it as a pass',C:'Treat it as high risk'}};
const DEF = {q8:'A',q1:'B',q2:'A',q3:'A',q4:'A',q5:'A',q6:'A',q7:'A',f1:'A',s1:'A',b1:'A'};
function mkFollow(){ const a=S.a;
  if (a.q1==='C') return {id:'f1',kind:'ret',owner:'po',text:'Conflict found. A 30-day period means keeping application data for 30 days, but architecture.md says the data retention policy deletes it after 7 days. How should we proceed?',opts:{A:'Use 7 days for now, inside the current policy',B:'Keep 30 days, and ask the Data Protection Officer to approve longer retention before release'}};
  if (a.q1==='A'||a.q2==='B') return {id:'f1',kind:'cov',owner:'po',text:`Gap found. The lender feedback describes three loans in one week for the same identity. With your answers (${QS[0].opts[a.q1]}, ${QS[1].opts[a.q2]}) that case would not be flagged. What do you want to do?`,opts:{A:'Change to 7 days and 3 or more, so the reported case is caught',B:'Keep my answers'}};
  return {id:'f1',kind:'scope',owner:'po',text:'One gap. Should the count include applications made to any lender that uses our API, or only applications to the same lender?',opts:{A:'Any lender that uses our API',B:'The same lender only'}};
}
const covFix = () => S.follow && S.follow.kind==='cov' && S.a.f1==='A';
const win = () => { const a=S.a; if (covFix()) return '7 days'; if (a.q1==='A') return '24 hours'; if (a.q1==='C') return a.f1==='B'?'30 days':'7 days'; return '7 days'; };
const winKey = () => ({'24 hours':'h24','7 days':'d7','30 days':'d30'})[win()];
const thrN = () => covFix()?3:(S.a.q2==='B'?5:3);
const lenderSet = () => S.a.q2==='C' && !covFix();
const dpo = () => S.follow && S.follow.kind==='ret' && S.a.f1==='B';
const raise = () => S.a.q3!=='B';
const matchND = () => S.a.q4==='B';
const matchTxt = () => matchND()?'name and date of birth':'name, date of birth and address';
const batch = () => S.a.q5==='B';
const lat = () => S.a.q6==='B'?'1 second':'200 milliseconds';
const tight = () => !!S.changes.stories;
const b1txt = () => ({A:'return reason code ID-VEL-00 "unable to check"',B:'treat it as a pass',C:'treat it as high risk'})[S.a.b1];

/* ================= the mock product ================= */
const APPS = {
 riley:{name:'Riley Chen', dob:'1994-11-02', addr:'8 Lantern Row, Westmarrow', note:'First application', base:14, codes:[['ADDR-OK','Address matches public records'],['DOC-OK','Identity document verified']], nda:{h24:1,d7:1,d30:1}, nd:{h24:1,d7:1,d30:1}, tnda:[0], tnd:[0]},
 alex:{name:'Alex Morgan', dob:'1988-03-14', addr:'12 Quillfeather Lane, Norbridge Vale', note:'4th application this week', base:22, codes:[['ADDR-OK','Address matches public records'],['DOC-OK','Identity document verified']], nda:{h24:2,d7:4,d30:9}, nd:{h24:2,d7:4,d30:9}, tnda:[0,0.6,3,5,9,13,18,22,27], tnd:[0,0.6,3,5,9,13,18,22,27]},
 maria:{name:'Maria Garcia', dob:'1990-06-21', addr:'3 Marlow Rise, Calderwyn', note:'Shares a name and birthday with another customer', base:18, codes:[['ADDR-OK','Address matches public records'],['DOC-OK','Identity document verified']], nda:{h24:1,d7:1,d30:1}, nd:{h24:1,d7:3,d30:6}, tnda:[0], tnd:[0,4,6,11,17,25]},
 jo:{name:'Jo Lee', dob:null, addr:'41 Thistle Court, Oldacre Bay', note:'Date of birth missing', base:35, codes:[['ADDR-OK','Address matches public records'],['DOC-PART','Document only partly readable']], nda:null, nd:null}
};
function assess(a, built){
  let score=a.base, codes=a.codes.map(c=>[...c,'ok']), why='', ms=300;
  if (built){ ms += S.a.q6==='B'?450:120;
    if (!a.dob){
      if (S.a.b1==='A'){ codes.push(['ID-VEL-00','Unable to check for repeat applications: date of birth missing','info']); why='The new check could not run, and it says so.'; }
      else if (S.a.b1==='C'){ score=Math.max(score,78); codes.push(['ID-VEL-01','Treated as high risk: date of birth missing','warn']); why='You chose to treat missing details as high risk.'; }
      else why='The new check was skipped. You chose to treat missing details as a pass.';
    } else {
      const c=(matchND()?a.nd:a.nda)[winKey()], t=thrN();
      if (c>=t){ codes.push(['ID-VEL-01', tight()?`${c} applications for this identity in the last ${win()}`:'Identity seen on multiple recent applications','warn']); if (raise()) score=Math.min(95,score+50); }
      why=`${c} application${c===1?'':'s'} matching on ${matchTxt()} in the last ${win()}. Your threshold is ${t}.`+(batch()?' Your build runs this check overnight, so the warning would arrive the next day.':'');
    }
  }
  const band = score>=70?'High risk':score>=40?'Medium risk':'Low risk';
  return {score, band, codes, why, ms};
}

BASE_SCORE = 10
RAISE_BY = 50


def combine(results):
    score = BASE_SCORE
    reason_codes = []
    details = {}
    for result in results:
        if result.code:
            reason_codes.append(result.code)
            if result.detail:
                details[result.code] = result.detail
        if result.raise_score:
            score = min(95, score + RAISE_BY)
    return score, reason_codes, details`},

 intent:{po:'This replaces the epic. It is shorter, earlier, and about outcomes. Its clarity shapes everything after.', ux:'The intent names who has the problem. Start thinking about the fraud analyst who will read this warning.', pm:'Work starts the moment there is an intent. Add it to the plan and open a risk and dependency log.'},
 workspace:{eng:'Check the AI found the right codebase. Everything it does next depends on it.', pm:'Two files matter to you: the state file shows progress, and the audit log records every decision.'},
 reverse:{arch:'You approve this stage. Check the summary matches how the system is really built. Mistakes here carry into everything that follows.', eng:'Read it for the details the Architect may not know, such as quirks in the code.', pm:'Constraints surface on day one. Log the data retention rule as a risk now, not when it blocks the release.'},
 requirements:{po:'Most questions are yours, and so is the approval. Each answer is a product decision you would otherwise make later, under pressure.', ux:'You answer how the warning appears to analysts. A clear warning is part of the requirement, not decoration.', arch:'You answer when the check runs. Real time or overnight changes the design.', eng:'You answer how much time the check may add. You stop finding gaps halfway through coding.', pm:'You answer the deadline, then help unblock everyone else. Unanswered questions are now the main blocker.'},
 stories:{po:'You approve this stage. You move from writing stories to editing the AI\'s draft.', ux:'The personas are yours to shape. Check each story describes what the analyst needs to see and understand.', eng:'Check every acceptance criterion can be tested. The AI writes tests straight from them.'},
 plan:{pm:'You approve this stage. It replaces the sprint plan: a list of stages, with reasons.', arch:'Advise on what is safe to skip. A risky change may need the design stage the AI dropped.', po:'The amount of process now matches the size of the change. You can ask for a skipped stage to be added back.'},
 units:{pm:'You approve this stage. Check the build order and flag any dependency that could block a unit.', arch:'Check the units are cleanly separated, so one can finish without the other.', eng:'Each unit is small enough to review properly.'},
 appdesign:{arch:'You approve this stage when it runs. It shows where the new parts sit before the work is split.', eng:'Check the design fits the code as it really is.', pm:'An added stage means one more approval. Make sure someone is free to give it.'},
 nfr:{arch:'You approve this stage. Speed, privacy and retention rules apply across the whole system, so they are yours to guard.', eng:'These requirements shape the code and the tests you will review.', po:'The AI\'s question about missing details is yours to answer. The scrambled fingerprint is a privacy decision you can explain to customers and regulators.'},
 code:{eng:'You approve the plan and the code. You type less and review more. The risk is approving without reading.', po:'Your decisions were settled before the plan was written. Read the plan to check it matches what you agreed.', pm:'The plan\'s checkboxes are your progress report. Each unit has its own plan and its own approvals.'},
 test:{po:'You accept the result. Each test maps to an acceptance criterion you approved.', ux:'Use the product as the analyst would. Is the warning easy to notice and understand?', eng:'Check the tests prove the criteria, not just that the code runs.'},
 ops:{eng:'Release and monitor through the existing pipeline, as today.', pm:'Coordinate the release as usual. In v2, release planning becomes part of the workflow.', po:'Tell lenders the new reason code is coming, then track whether reported fraud falls.'}
};
STAGES.forEach(s=>s.roles=PERSP[s.id]||{});
const SI = Object.fromEntries(STAGES.map((s,i)=>[s.id,i]));
const curStage = () => SI[STEPS[S.step].stage];

/* ================= steps ================= */
const fl = (p,label) => `<button class="flink" data-open="${p}">${label||fname(p)}</button>`;
const idea = t => `<div class="idea"><b>Key idea</b>${t}</div>`;
const approveChip = (owner, stage, label) => ({label:label||`Approve ${stage}`, text:'Approved. Please continue.', ops:()=>[{log:`${ROLES[owner]} approved: ${stage}`},{fn:()=>{S.clock+=30;}}]});
const askApprove = (owner, what) => ({say:`${what} Please review, then approve to continue, or ask for changes.`, ask:true, owner});
const build1 = () => [{say:'Building repeat-check. I\'ll tick each step in the plan as I finish it.'},{write:P.code},{tick:1},{mod:P.store},{tick:1},{tick:1},{tick:1},{mod:P.codes},{tick:1},{write:P.tests},{tick:1},{mod:P.assess},{tick:1},
  {say:'All 7 steps are done, in the order of the plan. I created the new check and its tests, and changed three existing files. Files I changed are marked <b>M</b> in the file list.'}];
const build2 = () => [{say:'Building console-warning.'},{mod:P.view},{tick2:1},{tick2:1},{write:P.tests2},{tick2:1},{fn:()=>{S.built=true;S.pv='after';}},
  {say:'All 3 steps are done. I changed <b>result_view.py</b> and added its tests.'}];
const STEPS = [
 {id:'tour', stage:'setup', title:'Find your way around', act:{type:'next'}, body:()=>`<p>This lab works like a real AI coding tool. You'll take one change through AI-DLC v1 from idea to working software.</p>
   <ul><li><b>Left, this guide.</b> It explains each step and tells you when it's your move.</li><li><b>Middle, the project.</b> Browse files as they are created, or switch to <b>App preview</b> to use the product.</li><li><b>Right, the AI assistant.</b> You send it messages and approve its work.</li></ul>
   <p>A red outline shows where to look next.</p><div class="box"><b>Your team</b><div class="team">${Object.keys(ROLES).map(k=>`<span class="tm" style="--rc:var(--${k})"><b>${NAMES[k]}</b> ${ROLES[k]}</span>`).join('')}</div><p>You drive the AI assistant on the team's behalf. Each step shows whose decision it is, and teammates chip in along the way.</p></div>`},
 {id:'rules', stage:'setup', title:'AI-DLC v1 is a set of rule files', act:{type:'open', paths:[P.rules]}, body:()=>`<p>AI-DLC v1 is not an app you install. It is a set of plain-text rule files, saved in the project, that the AI assistant reads and follows.</p>
   <p>Open ${fl(P.rules)} in the file list to see the rules. You'll recognise every stage in it by the end of this lab.</p>${idea('The rules make the AI work in stages, ask before it assumes, and wait for a person to approve.')}`},
 {id:'meet', stage:'setup', title:'Meet the product you\'ll change', act:{type:'preview', app:'alex', built:false}, body:()=>{ const ran=S.runs['a:alex']; return `<p>The <b>Identity Risk API</b> gives lenders a risk score for each loan applicant. The app preview shows the console a lender's fraud analyst uses.</p>
   <p>Select <b>Alex Morgan</b> and press <b>Run risk assessment</b>.</p>${ran?`<div class="box"><b>Did you spot the problem?</b><p>Alex scores 22, low risk. But these details have been used on 4 applications this week. The product looks at each application on its own, so it can't see that.</p><p>Lenders have complained about exactly this. Fixing it is your job in this lab.</p></div>`:''}`; }},
 {id:'intent-pick', stage:'intent', title:'Choose a good intent', act:{type:'choose', ok:2, opts:[
   {t:'"Add a new database table that logs every application, and a nightly job that counts duplicates."', fb:'That\'s a solution, not an intent. It decides how before anyone has agreed what.'},
   {t:'"Make our fraud detection better."', fb:'Too vague. Better at what, and for whom? The AI would have to guess.'},
   {t:`"${intentText}"`, fb:'Yes. It names the problem, who has it, and what success looks like. It leaves the how open.'}]},
  body:()=>`<p>An <b>intent</b> is a short statement of the outcome you want. It is the starting point for everything the AI does.</p><p>Intent is not a stage of its own in v1. Your request is logged in the audit file, then analysed in Requirements Analysis.</p><p>Lenders told us: "We approved three loans in one week for the same person's identity. Your score was low every time."</p><p>Which of these would you give the AI?</p>`},
 {id:'intent-send', stage:'intent', title:'Start the workflow', act:{type:'prompt', text:'Using AI-DLC, '+intentText[0].toLowerCase()+intentText.slice(1)},
  body:()=>`<p>Requests that begin with <b>"Using AI-DLC"</b> tell the assistant to follow the rule files instead of jumping straight to code.</p><p>Send the suggested message in the AI assistant panel.</p>${idea('You describe the outcome. The framework decides the steps.')}`,
  after:()=>[{log:'User request: "Using AI-DLC, '+intentText.slice(0,60)+'…"'},{say:'Welcome to AI-DLC v1. I\'ll take this change through Inception, then Construction. I will ask before I assume, and I will wait for approval at the end of each stage.'}]},
 {id:'ws-scan', stage:'workspace', title:'The AI looks around', act:{type:'open', paths:[P.state]},
  enter:()=>[{say:'Scanning the workspace…'},{write:P.state},{write:P.audit},{say:'I found existing code: the Identity Risk API. This is a <b>brownfield</b> project, so I will study the current product before changing anything. I\'ve created the <code>aidlc-docs</code> folder for everything I write.'}],
  body:()=>`<p>The AI's first job is to work out where it is. Is this a brand-new product (<b>greenfield</b>) or a change to an existing one (<b>brownfield</b>)? The answer decides which stages run.</p><p>A new folder, <code>aidlc-docs</code>, has appeared in the file list. Open ${fl(P.state)} to see how the AI tracks its own progress.</p>`},
 {id:'ws-audit', stage:'workspace', title:'The paper trail starts', act:{type:'open', paths:[P.audit]},
  body:()=>`<p>Open ${fl(P.audit)}. Your first message is already logged there. Every question, answer and approval from now on will be added automatically.</p>${idea('Nobody has to write up decisions afterwards. The record builds itself as the work happens.')}<p>This stage is quick housekeeping, so the AI moves straight on without asking for approval.</p>`},
 {id:'re-read', stage:'reverse', title:'The AI studies the existing product', act:{type:'open', paths:[P.arch]},
  enter:()=>[{say:'Reading the existing code…'},{write:P.biz},{write:P.arch},{write:P.api},{say:'I\'ve written three summaries of how the product works today. <b>architecture.md</b> is the one to read first.'},{mate:'arch',say:'I\'ll check this against the real system before we approve it.'}],
  body:()=>`<p>Before changing anything, the AI reads the code and writes down how the product works, in plain English. This stage only runs when there is existing code.</p><p>Open ${fl(P.arch)} and read the section "Things to know before changing it".</p>`},
 {id:'re-quiz', stage:'reverse', title:'Spot the constraint', act:{type:'choose', ok:1, opts:[
   {t:'An assessment takes about 300 milliseconds today.', fb:'Useful for judging speed later, but it doesn\'t limit what we can build.'},
   {t:'Application data is deleted after 7 days.', fb:'Yes. To count applications over time we need to keep them. This rule limits how far back the new check can look.'},
   {t:'Three checks run today.', fb:'True, but adding a fourth is straightforward.'}]},
  body:()=>`<p>We want to count how often an identity appears over time. Which fact in ${fl(P.arch)} could get in the way?</p>`},
 {id:'re-approve', stage:'reverse', title:'Your first approval gate', act:{type:'chips', chips:()=>[approveChip('arch','Reverse Engineering')]},
  enter:()=>[askApprove('arch','Reverse engineering is complete.')],
  body:()=>`<p>The AI has stopped. It will not start the next stage until a person approves this one. That pause is an <b>approval gate</b>, and almost every stage ends with one.</p><p>Each gate belongs to whoever owns that kind of decision. This one is about how the system is put together, so the <b>Architect</b> decides.</p><p>Reply in the AI assistant panel.</p>${idea('The AI drafts. People decide. Nothing moves on without a yes.')}`},
 {id:'rq-answer', stage:'requirements', title:'Answer the AI\'s questions', act:{type:'answer', qs:QS.map(q=>q.id)},
  enter:()=>[{say:'Before I write any requirements, I have 8 questions. I won\'t guess.'},{write:P.qs},{say:'They are in <b>requirement-verification-questions.md</b>. Choose an option for each, then tell me when you\'re done.'},{mate:'ux',say:'I asked the AI to include a question on how the warning looks to analysts.'},{mate:'arch',say:'Mine is the one about when the check runs. It changes the design.'}],
  body:()=>{ const n=QS.filter(q=>S.a[q.id]).length; return `<p>This is the heart of AI-DLC v1. The AI writes every open question into a <b>question file</b>. The team answers in the file, usually together in a session called <b>Mob Elaboration</b>.</p>
   <p>Open ${fl(P.qs)} and choose an answer for each question. Each one shows which role would normally decide.</p><div class="box"><b>${n} of ${QS.length} answered</b><p>There are no wrong answers, but your choices shape what gets built. You'll see the result in the app at the end.</p></div>`; }},
 {id:'rq-done', stage:'requirements', title:'Tell the AI you\'re done', act:{type:'prompt', text:'I\'ve answered all the questions.'},
  body:()=>`<p>The AI waits until someone says the answers are ready. Then it checks them against each other, and against what it learned about the existing product.</p><p>Send the message.</p>`,
  after:()=>[{fn:()=>{ S.qLock=true; QS.forEach(q=>log(`${ROLES[q.owner]} answered: ${q.text} ${q.opts[S.a[q.id]]}`)); }},{say:'Checking your answers against each other, the lender feedback and architecture.md…'},{fn:()=>{S.follow=mkFollow();}},{mod:P.qs}]},
 {id:'rq-follow', stage:'requirements', title:'The AI found something', act:{type:'answer', qs:['f1']},
  enter:()=>[{say:S.follow.text+' I\'ve added it to the question file.', ask:true, owner:'po'}],
  body:()=>`<p>The AI didn't just accept your answers. It compared them and found ${S.follow.kind==='ret'?'a <b>conflict</b> with the data retention rule you spotted earlier':S.follow.kind==='cov'?'a <b>gap</b>: your choices would miss the case lenders complained about':'a <b>gap</b>: something the answers didn\'t cover'}.</p><p>Scroll to the bottom of ${fl(P.qs)} and answer the follow-up.</p>${idea('Problems like this used to surface weeks later, in testing or in production. Here it costs one click.')}`,
  after:()=>[{fn:()=>{S.fLock=true; log(`Product Owner answered follow-up: ${S.follow.opts[S.a.f1]}`);}},{me:'I\'ve answered the follow-up.'},{say:'Thank you. Writing the requirements…'},{write:P.req},{say:'<b>requirements.md</b> is ready.'}]},
 {id:'rq-read', stage:'requirements', title:'Read the requirements', act:{type:'open', paths:[P.req]},
  body:()=>`<p>Open ${fl(P.req)}. Look for your own decisions in it: the time period, the threshold, what happens when the check fires.</p>${idea('Every requirement traces back to an answer someone gave. Nothing was invented by the AI.')}`},
 {id:'rq-approve', stage:'requirements', title:'Approve the requirements', act:{type:'chips', chips:()=>[approveChip('po','Requirements Analysis','Approve the requirements')]},
  enter:()=>[askApprove('po','Requirements analysis is complete.')],
  body:()=>`<p>These requirements describe what the product will do, so the <b>Product Owner</b> approves them.</p><p>Once approved, they become the instruction every later stage builds from.</p>`},
 {id:'st-plan', stage:'stories', title:'A plan before the stories', act:{type:'answer', qs:['s1'], file:P.sgp, hint:'Answer the question in story-generation-plan.md.'},
  enter:()=>[{say:'First I check whether this change needs user stories at all.'},{write:P.usa},{say:'It does: fraud analysts will see and act on a new warning. My reasoning is in <b>user-stories-assessment.md</b>.'},{write:P.sgp},{say:'Before I write any story I write a plan. <b>story-generation-plan.md</b> has one question for you.', ask:true, owner:'po'}],
  body:()=>`<p>User Stories has two parts, and each ends with its own approval.</p><ul><li><b>Part 1, planning.</b> The AI writes a plan with its questions. You answer, then approve the plan.</li><li><b>Part 2, generation.</b> The AI follows the approved plan and writes the stories. You approve those too.</li></ul><p>Open ${fl(P.sgp)} and answer the question.</p>${idea('Several stages work this way: a plan you approve, then the output you approve. You steer before the work is done, not only after.')}`,
  after:()=>[{fn:()=>{S.sLock=true; log(`Product Owner answered: ${SQ.text} ${SQ.opts[S.a.s1]}`);}},{me:'I\'ve answered the question in the plan.'}]},
 {id:'st-plan-approve', stage:'stories', title:'Approve the story plan', act:{type:'chips', chips:()=>[approveChip('po','story generation plan','Approve the story plan')]},
  enter:()=>[askApprove('po','The story generation plan is complete.')],
  body:()=>`<p>This is the first of the two gates in this stage. The <b>Product Owner</b> approves the plan before any story is written.</p><p>Reply in the AI assistant panel.</p>`},
 {id:'st-read', stage:'stories', title:'From requirements to stories', act:{type:'open', paths:[P.st]},
  enter:()=>[{say:'Plan approved. Writing personas and user stories from the approved requirements…'},{write:P.pers},{write:P.st},{say:'Three stories are ready in <b>stories.md</b>. Each acceptance criterion will become an automated test.'},{mate:'ux',say:'I shaped Farah\'s persona with the AI. Look hard at story 2: could a tester answer yes or no to it?'}],
  body:()=>`<p>User stories keep the work tied to real people. Each has <b>acceptance criteria</b>: the conditions that must be true for it to count as done.</p><p>Open ${fl(P.st)}. Read the "Accept when" lines closely. Could each one be tested with a clear yes or no?</p>`},
 {id:'st-decide', stage:'stories', title:'Edit, don\'t just accept', act:{type:'chips', chips:()=>[approveChip('po','User Stories','Approve the stories'),{label:'Request a change: make story 2 testable', text:'Story 2 says "the reason is clear". That can\'t be tested. Please make it specific: the warning must show how many applications were found and the time period.', stay:true, set:()=>{S.changes.stories=true; log('Product Owner requested a change to story 2');}, ops:()=>[{mod:P.st},{say:'Good catch. Story 2 now says the warning must show the count and the time period. The new lines are highlighted in stories.md.'}]}]},
  enter:()=>[askApprove('po','User stories are complete.')],
  body:()=>`<p>Look at story 2 in ${fl(P.st)}. ${tight()?'It now names exactly what the response must include. A test can check that.':'"The reason is clear" is an opinion, not a test. A vague criterion becomes a vague test, and then a vague product.'}</p><p>You can approve the draft as it is, or ask the AI to change it first.</p>${idea('You are the editor, not the author. Changing a draft takes seconds, so use that power.')}`},
 {id:'pl-read', stage:'plan', title:'The AI plans the rest', act:{type:'open', paths:[P.plan]},
  enter:()=>[{say:'Deciding which of the remaining stages this change needs…'},{write:P.plan},{say:'My plan is in <b>execution-plan.md</b>. I\'m skipping four stages and explaining why.'},{mate:'arch',say:'Skipping Application Design is fine by me for a change this small. Your call, Jordan.'}],
  body:()=>`<p>AI-DLC v1 is <b>adaptive</b>. A one-line fix skips almost everything. A new product runs every stage. The AI proposes what this change needs.</p><p>Open ${fl(P.plan)} and look at what it marked RUN and SKIP.</p>`},
 {id:'pl-decide', stage:'plan', title:'Challenge the plan', act:{type:'chips', chips:()=>[approveChip('pm','Workflow Planning','Approve the plan'),{label:'Request a change: add back Application Design', text:'Please add Application Design back in. I want to see where the new check fits before we build.', stay:true, set:()=>{S.changes.plan=true; log('Team asked for Application Design to be added back');}, ops:()=>[{mod:P.plan},{say:'Done. Application Design is back in the plan. It will run next as its own stage, with its own approval, before I split the work into units.'}]}]},
  enter:()=>[askApprove('pm','Workflow planning is complete.')],
  body:()=>`<p>The plan is the AI's proposal, not a decision. If a skipped stage worries you, ask for it back.</p><p>The plan sets out the order of work and its risks, so the <b>Project Manager</b> approves it, with the Architect's advice on what's safe to skip.</p>`},
 {id:'ad-read', stage:'appdesign', when:()=>!!S.changes.plan, title:'The design stage you asked for', act:{type:'open', paths:[P.comp]},
  enter:()=>[{say:'Application Design is back in the plan, so it runs now, before I split the work into units.'},{write:P.comp},{say:'<b>components.md</b> shows where the new check fits in the existing product.'}],
  body:()=>`<p>You asked for this stage, so it runs as a stage of its own, with its own document and its own approval.</p><p>Open ${fl(P.comp)}. For a change this small, the design is one short file.</p>`},
 {id:'ad-approve', stage:'appdesign', when:()=>!!S.changes.plan, title:'Approve the design', act:{type:'chips', chips:()=>[approveChip('arch','Application Design','Approve the design')]},
  enter:()=>[askApprove('arch','Application design is complete.')],
  body:()=>`<p>The design shows how the system is put together, so the <b>Architect</b> approves it.</p>`},
 {id:'un-plan', stage:'units', title:'A plan for splitting the work', act:{type:'open', paths:[P.uowp]},
  enter:()=>[{say:'Units Generation starts with a plan, like User Stories did.'},{write:P.uowp},{say:'<b>unit-of-work-plan.md</b> proposes two units. I have no questions this time: your earlier answers settle the split.'}],
  body:()=>`<p>A <b>unit of work</b> is a group of stories that is designed, built and tested together. Splitting the work lets each piece be finished and reviewed on its own.</p><p>Open ${fl(P.uowp)} to see the split the AI proposes.</p><div class="box"><b>No timetable here</b><p>v1 says what the units are and what order they come in. It does not plan how long each one takes.</p></div>`},
 {id:'un-plan-approve', stage:'units', title:'Approve the unit plan', act:{type:'chips', chips:()=>[approveChip('pm','unit of work plan','Approve the unit plan')]},
  enter:()=>[askApprove('pm','The unit of work plan is complete.')],
  body:()=>`<p>Two gates again. The <b>Project Manager</b> approves the plan first, then the units the AI writes from it.</p>`},
 {id:'un-read', stage:'units', title:'Split the work into units', act:{type:'open', paths:[P.units]},
  enter:()=>[{say:'Plan approved. Generating the units…'},{write:P.units},{write:P.dep},{write:P.map},{say:'Three files are ready. <b>unit-of-work.md</b> describes the two units. The other two show how they depend on each other, and which story belongs to which unit.'}],
  body:()=>`<p>Open ${fl(P.units)}. Each unit lists the requirements and stories it covers.</p><p>${fl(P.map)} gives every story to exactly one unit. ${fl(P.dep)} shows that the console warning needs the check, so the check is built first.</p>`},
 {id:'un-approve', stage:'units', title:'Approve the units', act:{type:'chips', chips:()=>[approveChip('pm','Units Generation','Approve the units')]},
  enter:()=>[askApprove('pm','Units generation is complete.')],
  body:()=>`<p>The units and their order are the delivery plan, so the <b>Project Manager</b> approves them.</p>`},
 {id:'inc-recap', stage:'units', title:'Inception is complete', act:{type:'next'},   body:()=>`<p>Pause and look at the <code>aidlc-docs/inception</code> folder. In a short time the team has agreed:</p><ul><li>how the product works today</li><li>what to build, in ${Object.keys(S.a).length} recorded decisions</li><li>stories with testable criteria</li><li>a plan, and the work split into units</li></ul>${idea('Inception is finished, and not one line of code has been written. That is the point. The thinking comes first, and the AI turns it into code quickly.')}<p>Next is <b>Construction</b>. It is a loop: each unit goes through its design stages and Code Generation before the next unit starts. Build and Test runs once at the end.</p>`},
 {id:'nfr-plan', stage:'nfr', title:'Unit 1: a question before the quality rules', act:{type:'answer', qs:['b1'], file:P.nfrp, hint:'Answer the question in repeat-check-nfr-requirements-plan.md.'},
  enter:()=>[{say:'Construction begins. I take one unit at a time, so I start with <b>repeat-check</b>. Functional Design is skipped, as planned, so its first stage is NFR Requirements.'},{write:P.nfrp},{say:'My plan for this stage has one question. The requirements don\'t say what the check should do when an application has no date of birth, and I won\'t guess. Please answer in <b>repeat-check-nfr-requirements-plan.md</b>.', ask:true, owner:'po'}],
  body:()=>`<p><b>Non-functional requirements</b> (NFRs) describe how well something must work: speed, privacy, security, and what happens when things go wrong.</p><p>While planning this stage, the AI found a case nobody had covered: what if an application has no date of birth? It stopped and asked instead of guessing.</p><p>Open ${fl(P.nfrp)} and answer. This is a business decision, so the <b>Product Owner</b> answers. Think about it: fraudsters sometimes leave fields blank on purpose, and genuine customers sometimes fill forms in badly.</p>${idea('The AI asks in a file, before any code is planned. Once a build plan is approved the AI follows it exactly, so gaps have to be closed first.')}`,
  after:()=>[{fn:()=>{S.bLock=true; log(`Product Owner answered: missing date of birth, ${b1txt()}`);}},{me:'I\'ve answered the question in the plan.'},{say:'Thank you. Writing the NFR requirements…'},{write:P.nfr},{say:'<b>nfr-requirements.md</b> is ready. It includes your answer. I\'ve also proposed storing a scrambled fingerprint of each identity, so we never keep raw personal details for this check.'}]},
 {id:'nfr-read', stage:'nfr', title:'How well must it work?', act:{type:'open', paths:[P.nfr]},
  body:()=>`<p>Open ${fl(P.nfr)}. Find your answer on the error handling line.</p><p>Notice the privacy line too. The AI proposed it, but a person has to agree to it.</p>`},
 {id:'nfr-approve', stage:'nfr', title:'Approve the NFRs', act:{type:'chips', chips:()=>[approveChip('arch','NFR Requirements (repeat-check)','Approve the NFR requirements')]},
  enter:()=>[askApprove('arch','NFR requirements for repeat-check are complete.')],
  body:()=>`<p>These quality rules apply across the whole system, so the <b>Architect</b> approves them.</p>`},
 {id:'cg-plan', stage:'code', title:'Unit 1: a plan before any code', act:{type:'open', paths:[P.cgp]},

  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="go" style="font-size:17px;padding:14px 22px">Start the lab</button><span style="color:var(--muted)">About 20 minutes. No technical knowledge needed. The scenario is made up for training.</span></div>
 </div></div>`; }

/* ================= events ================= */
document.addEventListener('click', e=>{ const t=e.target; const c=s=>t.closest(s); let x;
  const pop=document.getElementById('pop');
  if ((x=c('[data-jump]'))){ pop.hidden=true; jumpTo(+x.dataset.jump); return; }
  if (!c('#pop')) pop.hidden=true;
  if (c('#go')){ start(); return; }
  if ((x=c('[data-inst]'))){ S.inst=x.dataset.inst==='1'; renderAll(); return; }
  if (c('#btn-inst')){ S.inst=!S.inst; renderAll(); return; }
  if (c('#btn-restart')||c('#again')){ restart(); return; }
  if (!S.started) return;
  if ((x=c('[data-close]'))){ closeTab(x.dataset.close); return; }
  if ((x=c('[data-dir]'))){ S.col[x.dataset.dir]=!S.col[x.dataset.dir]; renderAll(); return; }
  if (c('#colall')){ const dirs=new Set(); Object.keys(S.files).forEach(p=>{ const a=p.split('/'); for (let i=1;i<a.length;i++) dirs.add(a.slice(0,i).join('/')+'/'); }); const any=Object.values(S.col).some(Boolean); S.col={}; if (!any) dirs.forEach(d=>S.col[d]=true); renderAll(); return; }
  if ((x=c('[data-open]'))){ openFile(x.dataset.open); return; }
  if ((x=c('[data-q]'))){ answer(x.dataset.q, x.dataset.v); return; }
  if ((x=c('[data-center]'))){ S.center=x.dataset.center; renderAll(); return; }
  if ((x=c('#mnav [data-pane]'))){ S.pane=x.dataset.pane; renderAll(); return; }
  if ((x=c('[data-sel]'))){ S.sel=x.dataset.sel; renderAll(); return; }
  if ((x=c('[data-pv]'))){ S.pv=x.dataset.pv; renderAll(); return; }
  if ((x=c('[data-chip]'))){ pick(+x.dataset.chip); return; }
  if ((x=c('[data-pick]'))){ const st=STEPS[S.step]; if (S.view!==S.step||st.act.type!=='choose') return; S.ch[st.id]=+x.dataset.pick; if (ready(st)) badge(st.id==='intent-pick'?'intent':'constraint'); renderAll(); return; }
  if ((x=c('[data-stage]'))){ const i=+x.dataset.stage, first=STEPS.findIndex((s,k)=>s.stage===STAGES[i].id&&live(k));
    if (first<0){ pop.dataset.kind='jump'; pop.innerHTML=S.files[P.plan]?`<b>${STAGES[i].name}: skipped for this change</b><p>${STAGES[i].why}</p><p style="color:var(--muted)">It is still one of the 13 stages of AI-DLC v1. A stage marked "when needed" only runs when the work calls for it.</p>`:`<b>${STAGES[i].name}</b><p>This stage only runs when the work needs it. The AI proposes whether to run it at Workflow Planning, and the team decides.</p>`; pop.hidden=false; }
    else if (first<=S.step){ S.view=Math.min(first,S.step); if (i===curStage()) S.view=S.step; renderAll(); }
    else if (S.busy){ pop.dataset.kind='jump'; pop.innerHTML='<p>Wait for the AI to finish, then try again.</p>'; pop.hidden=false; }
    else { pop.dataset.kind='jump'; pop.innerHTML=`<b>Jump ahead to ${STAGES[i].name}?</b><p style="color:var(--muted)">The steps in between will be completed for you with typical answers. Useful when leading a group.</p><div style="display:flex;gap:8px"><button class="btn primary" data-jump="${first}">Jump ahead</button><button class="btn" data-act="closepop">Cancel</button></div>`; pop.hidden=false; }
    return; }
  if ((x=c('[data-act]'))){ const a=x.dataset.act;
    if (a==='next'){ if (!S.busy&&S.view===S.step&&ready(STEPS[S.step])) next(); }
    else if (a==='send') send(); else if (a==='run') runAssess();
    else if (a==='closepop') pop.hidden=true;
    else if (a==='back'){ S.view=seek(S.view,-1); renderAll(); } else if (a==='fwd'){ S.view=seek(S.view,1); renderAll(); } else if (a==='current'){ S.view=S.step; renderAll(); }
  }
});
document.addEventListener('keydown', e=>{ if (!S.started||e.target.closest('select')) return; if (e.key==='ArrowRight'){ if (S.view<S.step){ S.view=seek(S.view,1); renderAll(); } else if (!S.busy){ const st=STEPS[S.step]; if (st.act.type==='prompt') send(); else if (ready(st)) next(); } } else if (e.key==='ArrowLeft'&&S.view>0){ S.view=seek(S.view,-1); renderAll(); } });

const isDark = () => { const t=document.documentElement.dataset.theme; return t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
const themeLabel = () => { const d=isDark(); document.getElementById('theme-txt').textContent = d ? 'Light mode' : 'Dark mode'; document.getElementById('btn-theme').dataset.mode = d ? 'dark' : 'light'; };
try { const t=localStorage.getItem('aidlc-lab-theme'); if (t==='dark'||t==='light') document.documentElement.dataset.theme=t; } catch(e){}
// The blade retracts into the hilt, the theme changes, then the blade comes back in the new colour.
let sheathing=false;
document.getElementById('btn-theme').addEventListener('click', e=>{ if (sheathing) return; const b=e.currentTarget; sheathing=true; b.classList.add('sheath');
  setTimeout(()=>{ const t=isDark()?'light':'dark'; document.documentElement.dataset.theme=t; try { localStorage.setItem('aidlc-lab-theme', t); } catch(e){} themeLabel(); b.classList.remove('sheath'); sheathing=false; }, reduce?0:300); });
themeLabel();
S=fresh(); load(); renderAll();
</script>
