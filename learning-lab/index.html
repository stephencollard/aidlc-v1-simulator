<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-DLC v1 Learning Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a calm three-panel studio. Lesson guide on the left, the project (files or the running app) in the middle, the AI assistant on the right. One red-outlined panel at a time shows where to look. */
  --bg:#ECEDEF; --panel:#FFFFFF; --panel2:#F5F6F7; --ink:#1B1D21; --muted:#5F656D; --line:#DADDE1;
  --accent:#C2202B; --soft:#FBE9EA; --po:#C0262D; --eng:#1F5FBF; --pm:#0F7B6C; --ux:#7A3EB1; --arch:#B4540A; --good:#2B7D3B; --warn:#A8650A; --bar:#1B1D21;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1013; --panel:#191B1F; --panel2:#1F2227; --ink:#ECEEF1; --muted:#9BA1A9; --line:#2D3138;
  --accent:#F0595F; --soft:#3A1F22; --po:#F07075; --eng:#7EA8F0; --pm:#4FC1AE; --ux:#B892E8; --arch:#F0A35E; --good:#6CC17A; --warn:#E0B04F; --bar:#08090A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1013; --panel:#191B1F; --panel2:#1F2227; --ink:#ECEEF1; --muted:#9BA1A9; --line:#2D3138;
  --accent:#F0595F; --soft:#3A1F22; --po:#F07075; --eng:#7EA8F0; --pm:#4FC1AE; --ux:#B892E8; --arch:#F0A35E; --good:#6CC17A; --warn:#E0B04F; --bar:#08090A; color-scheme:dark;}
html{font-size:calc(clamp(16px,min(1.1111vw,1.8605vh),40px) * var(--uz,1))}
.zoom{display:inline-flex;align-items:center;border:1px solid rgba(241,242,243,.25);border-radius:0.5rem;overflow:hidden}
.zoom button{all:unset;cursor:pointer;font:600 0.8125rem/1 var(--sans);padding:0.5rem 0.625rem;color:#F1F2F3;white-space:nowrap}
.zoom button:hover:not(:disabled){background:rgba(241,242,243,.1)}
.zoom button:disabled{opacity:.35;cursor:default}
.zoom button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.zoom .zl{font:500 0.75rem/1 var(--mono);min-width:2.75rem;text-align:center;padding:0.5rem 0.25rem;border-left:1px solid rgba(241,242,243,.2);border-right:1px solid rgba(241,242,243,.2)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:0.9375rem/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.2}
.k{font:600 0.6875rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:0.1875rem solid var(--accent);outline-offset:0.125rem}

/* top bar */
.top{background:var(--bar);color:#F1F2F3;display:flex;align-items:center;gap:1.125rem;padding:0.5rem 0.875rem;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:0.625rem;font-weight:700;font-size:1rem;white-space:nowrap}
.brand i{width:1.625rem;height:1.625rem;border-radius:0.4375rem;background:#C2202B;display:grid;place-items:center;font:700 0.75rem/1 var(--mono);font-style:normal;color:#fff}
.stepper{flex:1;display:flex;align-items:flex-end;gap:0.625rem;min-width:0;overflow-x:auto;padding:0.125rem 0}
.ph{display:flex;flex-direction:column;gap:0.25rem}
.ph .pn{font:600 0.5938rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(241,242,243,.55)}
.ph .ds{display:flex;gap:0.1875rem}
.dot{all:unset;cursor:pointer;width:1.625rem;height:1.625rem;border-radius:50%;display:grid;place-items:center;font:600 0.7188rem/1 var(--mono);color:rgba(241,242,243,.6);border:0.0938rem solid rgba(241,242,243,.28)}
.dot.done{background:#2B7D3B;border-color:#2B7D3B;color:#fff}
.dot.now{background:#C2202B;border-color:#C2202B;color:#fff;box-shadow:0 0 0 0.25rem rgba(194,32,43,.35)}
.dot.view{outline:0.125rem solid #fff;outline-offset:0.125rem}
.dot.skip{border-style:dashed;color:rgba(241,242,243,.5)}
.now-name{font-size:0.8438rem;color:rgba(241,242,243,.85);white-space:nowrap;align-self:center}
.tools{display:flex;align-items:center;gap:0.5rem}
.tb{all:unset;cursor:pointer;font:500 0.8125rem/1 var(--sans);padding:0.5rem 0.625rem;border-radius:0.5rem;border:1px solid rgba(241,242,243,.25);white-space:nowrap}
.tb:hover{background:rgba(241,242,243,.1)}
.tb[aria-pressed="true"]{background:#F1F2F3;color:#1B1D21}
#btn-theme{display:inline-flex;align-items:center;gap:0.5625rem}
.saber{display:inline-flex;flex-direction:column;align-items:center;margin:-0.3125rem 0;--sc:#FF3B45}
#btn-theme[data-mode="dark"] .saber{--sc:#3D9BFF}
.saber .blade{width:0.1875rem;height:0.9375rem;border-radius:0.125rem 0.125rem 0 0;background:var(--sc);box-shadow:0 0 0.25rem 1px var(--sc),0 0 0.5625rem 1px color-mix(in srgb,var(--sc) 55%,transparent);transform-origin:50% 100%;transition:transform .28s ease-in}
#btn-theme.sheath .blade{transform:scaleY(0)}
.saber .hilt{width:0.3125rem;height:0.4375rem;border-radius:1px 1px 0.125rem 0.125rem;background:linear-gradient(#C9CDD3 0 0.125rem,#7D838C 0.125rem 0.1875rem,#A4A9B1 0.1875rem)}

.pop{position:absolute;right:0.875rem;top:3.375rem;z-index:40;width:min(23.75rem,calc(100vw - 1.75rem));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:0.875rem;box-shadow:0 1.125rem 3.125rem rgba(0,0,0,.25);padding:0.875rem;display:flex;flex-direction:column;gap:0.5rem;max-height:70vh;overflow:auto}
.bcard{display:flex;gap:0.625rem;align-items:flex-start;padding:0.5rem 0.625rem;border-radius:0.625rem;border:1px solid var(--line);opacity:.5}
.bcard.on{opacity:1;background:var(--soft);border-color:var(--accent)}
.bcard span.e{font-size:1.375rem;line-height:1}.bcard:not(.on) span.e{filter:grayscale(1)}
.bcard p{font-size:0.8125rem;color:var(--muted)}
#toast{position:fixed;top:3.75rem;left:50%;transform:translateX(-50%);z-index:60;background:var(--bar);color:#fff;padding:0.625rem 1rem;border-radius:62.4375rem;font-weight:500;box-shadow:0 0.625rem 1.875rem rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2)}

/* main grid */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(14.375rem,var(--wl,25.625rem)) 0.625rem minmax(18.75rem,1fr) 0.625rem minmax(14.375rem,var(--wr,22.5rem));gap:0;padding:0.625rem}
body.inst{--wl:29.375rem}
.split{cursor:col-resize;position:relative;touch-action:none;border-radius:0.375rem}
.split::after{content:"";position:absolute;left:50%;top:50%;width:0.25rem;height:2.5rem;border-radius:0.25rem;transform:translate(-50%,-50%);background:color-mix(in srgb,var(--muted) 45%,transparent);transition:height .15s,background .15s}
.split:hover::after,.split.drag::after,.split:focus-visible::after{background:var(--accent);height:4.5rem}
body.resizing{user-select:none;cursor:col-resize}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:0.875rem;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;transition:box-shadow .2s}
.pane.attn,.composer.attn{box-shadow:0 0 0 0.1875rem var(--accent)}
.pane.working{box-shadow:0 0 0 0.1875rem color-mix(in srgb,var(--muted) 55%,transparent)}
.phd{display:flex;align-items:center;gap:0.5rem;padding:0.625rem 0.875rem;border-bottom:1px solid var(--line);flex:0 0 auto}
.phd h2{font-size:0.8125rem;font-weight:600;letter-spacing:.02em}
.scroll{flex:1;min-height:0;overflow-y:auto}

/* guide */
.g-body{padding:1rem 1.125rem 1.25rem;display:flex;flex-direction:column;gap:0.875rem}
body.inst .g-body{font-size:1.0625rem}
.chipst{display:inline-flex;gap:0.375rem;align-items:center;font:600 0.6875rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.g-body h2{font-size:1.5rem;font-weight:700}
.g-body h3{font-size:1.0625rem;font-weight:600}
.sdots{display:flex;gap:0.3125rem;align-items:center}
.sdots i{width:1.375rem;height:0.3125rem;border-radius:0.5625rem;background:var(--line)}
.sdots i.d{background:var(--good)}.sdots i.c{background:var(--accent)}
.g-body p{max-width:62ch}
.g-body ul{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:0.3125rem}
.idea{border-left:0.25rem solid var(--accent);background:var(--soft);border-radius:0 0.625rem 0.625rem 0;padding:0.625rem 0.75rem}
.idea b{display:block;font:600 0.6875rem/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.box{border:1px solid var(--line);border-radius:0.625rem;padding:0.625rem 0.75rem;display:flex;flex-direction:column;gap:0.375rem;background:var(--panel2)}
.outs{list-style:none;padding:0!important;gap:0.25rem!important}
.outs li{display:flex;gap:0.5rem;align-items:center;font:0.8125rem/1.4 var(--mono)}
.outs .tk{width:1rem;height:1rem;border-radius:0.25rem;border:0.0938rem solid var(--muted);display:grid;place-items:center;font-size:0.6875rem;flex:0 0 auto}
.outs li.w .tk{background:var(--good);border-color:var(--good);color:#fff}
.flink{all:unset;cursor:pointer;font-family:var(--mono);font-size:.9em;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:0.1875rem}
.role{border-left:0.25rem solid var(--rc);padding:0.125rem 0 0.125rem 0.75rem}
.role b{color:var(--rc)}
.opt{all:unset;cursor:pointer;display:block;border:0.0938rem solid var(--line);border-radius:0.625rem;padding:0.625rem 0.75rem;background:var(--panel)}
.opt:hover{border-color:var(--muted)}
.opt.no{border-color:var(--warn)}.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--panel))}
.fb{font-size:.92em;margin-top:0.375rem;display:block}
.opt.no .fb{color:var(--warn)}.opt.ok .fb{color:var(--good)}
.g-foot{flex:0 0 auto;border-bottom:1px solid var(--line);padding:0.75rem 0.875rem;display:flex;flex-direction:column;gap:0.5rem;background:var(--panel2)}
.move{display:flex;gap:0.625rem;align-items:center}
.move .lab{flex:0 0 auto;font:700 0.6875rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#fff;padding:0.375rem 0.5rem;border-radius:0.375rem}
.move .lab.wait{background:var(--muted)}
.btn{border:0.0938rem solid var(--line);background:var(--panel);border-radius:0.625rem;padding:0.625rem 0.875rem;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:0.375rem 0.625rem;font-size:0.8125rem;font-weight:500}
.navrow{display:flex;gap:0.375rem;align-items:center;justify-content:space-between}

/* workspace */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:0.5625rem;overflow:hidden;background:var(--panel2)}
.seg{flex:0 0 auto}
.seg button{all:unset;cursor:pointer;padding:0.4375rem 0.75rem;font:500 0.8125rem/1 var(--sans);white-space:nowrap}
.phd h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg.sm button{padding:0.3125rem 0.5625rem;font-size:0.75rem}
.wsb{flex:1;min-height:0;display:grid;grid-template-columns:14.375rem minmax(0,1fr)}
.exp{border-right:1px solid var(--line);background:var(--panel2);overflow-y:auto;padding:0.5rem 0.375rem 1rem;font:0.8125rem/1.35 var(--mono)}
.exp .root{font:600 0.6875rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0.375rem 0.5rem 0.5rem}
.dir{color:var(--muted);padding:0.25rem 0.5rem;white-space:nowrap}
.frow{all:unset;cursor:pointer;display:flex;align-items:center;gap:0.375rem;padding:0.25rem 0.5rem;border-radius:0.375rem;width:100%;box-sizing:border-box;white-space:nowrap}
.frow:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.frow.cur{background:color-mix(in srgb,var(--ink) 11%,transparent);font-weight:600}
.frow .nm{overflow:hidden;text-overflow:ellipsis}
.frow .mk{margin-left:auto;font:600 0.625rem/1 var(--mono);padding:0.125rem 0.25rem;border-radius:0.25rem}
.mk.n{background:var(--good);color:#fff}.mk.m{background:var(--warn);color:#fff}
.frow.need{box-shadow:inset 0 0 0 0.125rem var(--accent);background:var(--soft);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 0.125rem var(--accent),0 0 0 0.25rem color-mix(in srgb,var(--accent) 25%,transparent)}}
.ed{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel2);flex:0 0 auto}
.tab{all:unset;cursor:pointer;font:0.7812rem/1 var(--mono);padding:0.5625rem 0.75rem;border-right:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.tab.cur{background:var(--panel);color:var(--ink);box-shadow:inset 0 0.125rem 0 var(--accent)}
.about{flex:0 0 auto;padding:0.5rem 0.875rem;border-bottom:1px solid var(--line);font-size:0.8438rem;display:flex;gap:0.5rem;align-items:baseline;flex-wrap:wrap}
.about .p{font:0.75rem/1.3 var(--mono);color:var(--muted)}
.code{flex:1;min-height:0;overflow:auto;padding:0.625rem 0 1.875rem;font:0.8438rem/1.65 var(--mono)}
.ln{display:flex}
.ln .no{flex:0 0 2.75rem;text-align:right;padding-right:0.75rem;color:color-mix(in srgb,var(--muted) 60%,transparent);user-select:none}
.ln .tx{flex:1;white-space:pre-wrap;word-break:break-word;padding-right:0.875rem;min-height:1.65em}
.ln.add{background:color-mix(in srgb,var(--good) 13%,transparent)}
.ln.add .no{color:var(--good)}
.t-h{font-weight:600;color:var(--accent)}.t-c{color:var(--muted);font-style:italic}.t-s{color:var(--pm)}.t-k{color:var(--eng);font-weight:500}.t-ok{color:var(--good);font-weight:600}.t-code{background:var(--panel2);border-radius:0.25rem;padding:0 0.1875rem}
.optline{all:unset;cursor:pointer;display:inline-block;padding:1px 0.625rem;border-radius:0.375rem;border:0.0938rem solid var(--line);margin:1px 0}
.optline:hover{border-color:var(--accent)}
.optline.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.optline:disabled{cursor:default;opacity:.75}
.own{font:600 0.6562rem/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:0.1875rem 0.375rem;border-radius:0.3125rem;color:#fff;background:var(--rc)}
:root[data-theme="dark"] .own{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .own{color:#111}}
.empty{flex:1;display:grid;place-items:center;color:var(--muted);padding:1.875rem;text-align:center}

/* app preview */
.pv{flex:1;min-height:0;overflow:auto;padding:1rem;background:var(--panel2)}
.browser{border:1px solid var(--line);border-radius:0.75rem;overflow:hidden;background:var(--panel);max-width:61.25rem;margin:0 auto;box-shadow:0 0.625rem 1.875rem rgba(0,0,0,.08)}
.bbar{display:flex;align-items:center;gap:0.625rem;padding:0.5rem 0.75rem;background:var(--panel2);border-bottom:1px solid var(--line)}
.bbar .d3{display:flex;gap:0.3125rem}.bbar .d3 i{width:0.625rem;height:0.625rem;border-radius:50%;background:var(--line)}
.url{flex:1;font:0.75rem/1 var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:62.4375rem;padding:0.375rem 0.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apph{display:flex;flex-wrap:wrap;gap:0.5rem 0.875rem;align-items:center;padding:0.875rem 1.125rem;border-bottom:1px solid var(--line)}
.apph b{font-size:1.0625rem}
.ver{font:500 0.75rem/1 var(--mono);padding:0.3125rem 0.5625rem;border-radius:62.4375rem;border:1px solid var(--line);color:var(--muted)}
.ver.new{border-color:var(--good);color:var(--good)}
.appg{display:grid;grid-template-columns:minmax(0,15.625rem) minmax(0,1fr);gap:0}
.people{border-right:1px solid var(--line);padding:0.75rem;display:flex;flex-direction:column;gap:0.5rem}
.person{all:unset;cursor:pointer;border:0.0938rem solid var(--line);border-radius:0.625rem;padding:0.5625rem 0.6875rem;display:flex;flex-direction:column;gap:0.125rem}
.person.sel{border-color:var(--ink);background:var(--panel2)}
.person small{color:var(--muted);font-size:0.7812rem}
.person.need{border-color:var(--accent);animation:pulse 1.5s ease-in-out infinite}
.res{padding:1rem 1.125rem;display:flex;flex-direction:column;gap:0.875rem;min-width:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:0.1875rem 0.875rem;font-size:0.875rem}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.outcome{display:flex;flex-wrap:wrap;gap:1.125rem;align-items:center;border-top:1px dashed var(--line);padding-top:0.875rem}
.gauge{flex:0 0 11.25rem;text-align:center}
.gauge .num{font:700 2.5rem/1 var(--mono);margin-top:-2.875rem}
.band{font:700 0.75rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:0.375rem}
.codes{flex:1 1 16.25rem;display:flex;flex-direction:column;gap:0.375rem;min-width:0}
.rc{display:flex;gap:0.5rem;align-items:baseline;border:1px solid var(--line);border-radius:0.5rem;padding:0.4375rem 0.625rem;font-size:0.875rem}
.rc code{font:600 0.75rem/1.4 var(--mono);white-space:nowrap}
.rc.warn{border-color:var(--accent);background:var(--soft)}.rc.warn code{color:var(--accent)}
.rc.info{border-color:var(--warn)}.rc.info code{color:var(--warn)}
.why{font-size:0.8438rem;color:var(--muted)}
pre.json{margin:0.5rem 0 0;background:var(--panel2);border-radius:0.5rem;padding:0.625rem;font:0.7812rem/1.5 var(--mono);overflow:auto}
details summary{cursor:pointer;font-size:0.8438rem;color:var(--muted)}

/* chat */
.chat{padding:0.875rem;display:flex;flex-direction:column;gap:0.625rem}
.m{max-width:94%;padding:0.5625rem 0.75rem;border-radius:0.75rem;font-size:0.9062rem;display:flex;flex-direction:column;gap:0.375rem}
.m.ai{background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:0.25rem}
.m.ai.ask{border:0.0938rem solid var(--rc,var(--accent))}
.m.me{background:var(--ink);color:var(--panel);align-self:flex-end;border-top-right-radius:0.25rem}
.m.term{background:#0E0F11;color:#D6D9DD;font:0.75rem/1.6 var(--mono);white-space:pre;overflow-x:auto;align-self:stretch;max-width:100%}
.m.term .p{color:#6CC17A}
.typing i{display:inline-block;width:0.375rem;height:0.375rem;border-radius:50%;background:var(--muted);margin-right:0.1875rem;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.composer{flex:0 0 auto;border-bottom:1px solid var(--line);max-height:60%;overflow-y:auto;padding:0.75rem;display:flex;flex-direction:column;gap:0.5rem;background:var(--panel2);margin:0;transition:box-shadow .2s}
.sugg{border:1px dashed var(--muted);border-radius:0.625rem;padding:0.5rem 0.625rem;background:var(--panel);font-size:0.875rem;max-height:8.125rem;overflow:auto}
.hintc{color:var(--muted);font-size:0.8438rem}
.chipb{text-align:left}

/* summary */
.sumv{flex:1;overflow:auto;padding:1.375rem;display:flex;flex-direction:column;gap:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:0.75rem}
.big{font:700 2.75rem/1 var(--mono);color:var(--accent)}

/* start overlay */
.veil{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bar) 72%,transparent);backdrop-filter:blur(0.3125rem);display:grid;place-items:center;padding:1rem;overflow:auto}

.pk[aria-pressed="true"]{border-color:var(--c,var(--ink));background:var(--panel2)}

.mnav{display:none}

@media (max-width:980px){

  body[data-pane="guide"] #pane-guide,body[data-pane="ws"] #pane-ws,body[data-pane="ai"] #pane-ai{display:flex}
  .mnav{display:flex;flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel)}

  .wsb{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}

  .appg{grid-template-columns:1fr}.people{border-right:none;border-bottom:1px solid var(--line)}
  .pick{grid-template-columns:1fr}.pick.two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const ADD = '\u0001';

let S, gen = 0;

/* ================= decisions ================= */
const QS = [
 {id:'q1', owner:'po', text:'Over what time period should repeat applications count?', opts:{A:'24 hours',B:'7 days',C:'30 days'}},
 {id:'q2', owner:'po', text:'How many applications in that period should count as suspicious?', opts:{A:'3 or more',B:'5 or more',C:'Let each lender set their own number (default 3)'}},
 {id:'q3', owner:'po', text:'What should happen when the check is triggered?', opts:{A:'Raise the risk score and add a reason code',B:'Add a reason code only, and leave the score unchanged'}},
 {id:'q4', owner:'po', text:'What counts as "the same identity"?', opts:{A:'Name, date of birth and address together',B:'Name and date of birth only'}},
 {id:'q8', owner:'ux', text:'How should the warning appear to a fraud analyst in the console?', opts:{A:'As a highlighted reason code in the list',B:'As a banner above the result, plus the reason code'}},
 {id:'q5', owner:'arch', text:'When should the check run?', opts:{A:'In real time, during every risk assessment',B:'Overnight, in a batch'}},
 {id:'q6', owner:'eng', text:'How much extra time may the check add to an assessment?', opts:{A:'Under 200 milliseconds',B:'Under 1 second'}},
 {id:'q7', owner:'pm', text:'Is there a date this must be live by?', opts:{A:'Yes, the end-of-quarter customer release',B:'No fixed date'}}
];
const SQ = {id:'s1', owner:'po', text:'How should the stories be organised?', opts:{A:'Around each persona: who needs what',B:'Around each feature of the check'}};
const BQ = {id:'b1', owner:'po', text:'Error handling. An application sometimes arrives with no date of birth, so the check cannot match the identity. The requirements do not say what should happen. What should the check do?', opts:{A:'Return a reason code that says "unable to check"',B:'Treat it as a pass',C:'Treat it as high risk'}};
const DEF = {q8:'A',q1:'B',q2:'A',q3:'A',q4:'A',q5:'A',q6:'A',q7:'A',f1:'A',s1:'A',b1:'A'};
function mkFollow(){ const a=S.a;
  if (a.q1==='C') return {id:'f1',kind:'ret',owner:'po',text:'Conflict found. A 30-day period means keeping application data for 30 days, but architecture.md says the data retention policy deletes it after 7 days. How should we proceed?',opts:{A:'Use 7 days for now, inside the current policy',B:'Keep 30 days, and ask the Data Protection Officer to approve longer retention before release'}};
  if (a.q1==='A'||a.q2==='B') return {id:'f1',kind:'cov',owner:'po',text:`Gap found. The lender feedback describes three loans in one week for the same identity. With your answers (${QS[0].opts[a.q1]}, ${QS[1].opts[a.q2]}) that case would not be flagged. What do you want to do?`,opts:{A:'Change to 7 days and 3 or more, so the reported case is caught',B:'Keep my answers'}};
  return {id:'f1',kind:'scope',owner:'po',text:'One gap. Should the count include applications made to any lender that uses our API, or only applications to the same lender?',opts:{A:'Any lender that uses our API',B:'The same lender only'}};
}
const covFix = () => S.follow && S.follow.kind==='cov' && S.a.f1==='A';
const win = () => { const a=S.a; if (covFix()) return '7 days'; if (a.q1==='A') return '24 hours'; if (a.q1==='C') return a.f1==='B'?'30 days':'7 days'; return '7 days'; };
const winKey = () => ({'24 hours':'h24','7 days':'d7','30 days':'d30'})[win()];
const thrN = () => covFix()?3:(S.a.q2==='B'?5:3);
const lenderSet = () => S.a.q2==='C' && !covFix();
const dpo = () => S.follow && S.follow.kind==='ret' && S.a.f1==='B';
const raise = () => S.a.q3!=='B';
const matchND = () => S.a.q4==='B';

const batch = () => S.a.q5==='B';
const lat = () => S.a.q6==='B'?'1 second':'200 milliseconds';
const tight = () => !!S.changes.stories;
// Flaws planted in the AI's drafts. Each is either caught at its approval gate, or found late.
const reOK = () => !!(S.changes.re||S.late.re);
const planBug = () => !(S.changes.cgplan||S.late.plan);
const testGap = () => !(S.changes.tests||S.late.test);
const b1txt = () => ({A:'return reason code ID-VEL-00 "unable to check"',B:'treat it as a pass',C:'treat it as high risk'})[S.a.b1];

/* ================= the mock product ================= */
const APPS = {
 riley:{name:'Riley Chen', dob:'1994-11-02', addr:'8 Lantern Row, Westmarrow', note:'First application', base:14, codes:[['ADDR-OK','Address matches public records'],['DOC-OK','Identity document verified']], nda:{h24:1,d7:1,d30:1}, nd:{h24:1,d7:1,d30:1}, tnda:[0], tnd:[0]},
 alex:{name:'Alex Morgan', dob:'1988-03-14', addr:'12 Quillfeather Lane, Norbridge Vale', note:'4th application this week', base:22, codes:[['ADDR-OK','Address matches public records'],['DOC-OK','Identity document verified']], nda:{h24:2,d7:4,d30:9}, nd:{h24:2,d7:4,d30:9}, tnda:[0,0.6,3,5,9,13,18,22,27], tnd:[0,0.6,3,5,9,13,18,22,27]},
 maria:{name:'Maria Garcia', dob:'1990-06-21', addr:'3 Marlow Rise, Calderwyn', note:'Shares a name and birthday with another customer', base:18, codes:[['ADDR-OK','Address matches public records'],['DOC-OK','Identity document verified']], nda:{h24:1,d7:1,d30:1}, nd:{h24:1,d7:3,d30:6}, tnda:[0], tnd:[0,4,6,11,17,25]},
 jo:{name:'Jo Lee', dob:null, addr:'41 Thistle Court, Oldacre Bay', note:'Date of birth missing', base:35, codes:[['ADDR-OK','Address matches public records'],['DOC-PART','Document only partly readable']], nda:null, nd:null}
};
function assess(a, built){
  let score=a.base, codes=a.codes.map(c=>[...c,'ok']), why='', ms=300;
  if (built){ ms += S.a.q6==='B'?450:120;
    if (!a.dob){
      if (S.a.b1==='A'){ codes.push(['ID-VEL-00','Unable to check for repeat applications: date of birth missing','info']); why='The new check could not run, and it says so.'; }
      else if (S.a.b1==='C'){ score=Math.max(score,78); codes.push(['ID-VEL-01','Treated as high risk: date of birth missing','warn']); why='You chose to treat missing details as high risk.'; }
      else why='The new check was skipped. You chose to treat missing details as a pass.';
    } else {
      const c=(matchND()?a.nd:a.nda)[winKey()], t=thrN();
      if (planBug()?c>t:c>=t){ codes.push(['ID-VEL-01', tight()?`${c} applications for this identity in the last ${win()}`:'Identity seen on multiple recent applications','warn']); if (raise()) score=Math.min(95,score+50); }

    }
  }
  const band = score>=70?'High risk':score>=40?'Medium risk':'Low risk';
  return {score, band, codes, why, ms};
}

const STAGE_FILES = ()=>STAGES.filter(s=>s.n>0);
const FILES = {
 'README.md':{lang:'md', about:'The front page of the project. It says what the product does.', gen:()=>`# Identity Risk API

Lenders send us a loan applicant's details. We return a risk score from 0 to 100 and reason codes that explain the score.

## How it works today
1. A lender sends an application: name, date of birth, address.
2. We run three checks: address match, document check, sanctions list.
3. We combine the results into one score and a list of reason codes.

## Folders

 'aidlc-docs/inception/reverse-engineering/business-overview.md':{lang:'md', about:'What the product is for, in business terms.', gen:()=>`# Business overview

The Identity Risk API helps lenders decide whether a loan application is likely to be fraudulent.

## Who uses it
- Lenders' systems call the API for every loan application.
- Lenders' fraud analysts read the score and reason codes in the console.

## What it returns
- A risk score from 0 (safe) to 100 (very risky)
- Reason codes that explain the score`},
 'aidlc-docs/inception/reverse-engineering/architecture.md':{lang:'md', about:'A plain-English summary of how the existing product works, written by the AI after reading the code.', gen:()=>`# How the Identity Risk API works today

## Flow of one assessment
1. A lender sends an applicant's name, date of birth and address.
2. Three checks run: address match, document check, sanctions list.
3. The results are combined into a risk score (0 to 100) with reason codes.

## Things to know before changing it
- Each application is assessed on its own. No check looks across applications.
- Application data is deleted after 7 days (data retention policy, \`storage/applications.py\`).
- An assessment takes about 300 milliseconds today.
${reOK()?ADD:''}- A failed check raises the risk score by ${reOK()?50:30} points (\`scoring/score.py\`).
- Reason codes live in one list: \`reason_codes/codes.py\`.`},

 'src/scoring/score.py':{lang:'py', about:'How the results of all the checks become one score from 0 to 100.', gen:()=>`"""Combine check results into one risk score."""

BASE_SCORE = 10
RAISE_BY = 50


def combine(results):
    score = BASE_SCORE
    reason_codes = []
    details = {}
    for result in results:
        if result.code:
            reason_codes.append(result.code)
            if result.detail:
                details[result.code] = result.detail
        if result.raise_score:
            score = min(95, score + RAISE_BY)
    return score, reason_codes, details`},

 {id:'rq-follow', stage:'requirements', title:'The AI found something', act:{type:'answer', qs:['f1']},
  enter:()=>[{say:S.follow.text+' I\'ve added it to the question file.', ask:true, owner:'po'}],
  body:()=>`<p>The AI didn't just accept your answers. It compared them and found ${S.follow.kind==='ret'?'a <b>conflict</b> with the data retention rule you spotted earlier':S.follow.kind==='cov'?'a <b>gap</b>: your choices would miss the case lenders complained about':'a <b>gap</b>: something the answers didn\'t cover'}.</p><p>Scroll to the bottom of ${fl(P.qs)} and answer the follow-up.</p>${idea('Problems like this used to surface weeks later, in testing or in production. Here it costs one click.')}`,
  after:()=>[{fn:()=>{S.fLock=true; log(`Product Owner answered follow-up: ${S.follow.opts[S.a.f1]}`);}},{me:'I\'ve answered the follow-up.'},{say:'Thank you. Writing the requirements…'},{write:P.req},{say:'<b>requirements.md</b> is ready.'}]},
 {id:'rq-read', stage:'requirements', title:'Read the requirements', act:{type:'open', paths:[P.req]},
  body:()=>`<p>Open ${fl(P.req)}. Look for your own decisions in it: the time period, the threshold, what happens when the check fires.</p>${idea('Every requirement traces back to an answer someone gave. Nothing was invented by the AI.')}`},
 {id:'rq-approve', stage:'requirements', title:'Approve the requirements', act:{type:'chips', chips:()=>[approveChip('po','Requirements Analysis','Approve the requirements')]},
  enter:()=>[askApprove('po','Requirements analysis is complete.')],
  body:()=>`<p>These requirements describe what the product will do, so the <b>Product Owner</b> approves them.</p><p>Once approved, they become the instruction every later stage builds from.</p>`},
 {id:'st-plan', stage:'stories', title:'A plan before the stories', act:{type:'answer', qs:['s1'], file:P.sgp, hint:'Answer the question in story-generation-plan.md.'},
  enter:()=>[{say:'First I check whether this change needs user stories at all.'},{write:P.usa},{say:'It does: fraud analysts will see and act on a new warning. My reasoning is in <b>user-stories-assessment.md</b>.'},{write:P.sgp},{say:'Before I write any story I write a plan. <b>story-generation-plan.md</b> has one question for you.', ask:true, owner:'po'}],
  body:()=>`<p>User Stories has two parts, and each ends with its own approval.</p><ul><li><b>Part 1, planning.</b> The AI writes a plan with its questions. You answer, then approve the plan.</li><li><b>Part 2, generation.</b> The AI follows the approved plan and writes the stories. You approve those too.</li></ul><p>Open ${fl(P.sgp)} and answer the question.</p>${idea('Several stages work this way: a plan you approve, then the output you approve. You steer before the work is done, not only after.')}`,
  after:()=>[{fn:()=>{S.sLock=true; log(`Product Owner answered: ${SQ.text} ${SQ.opts[S.a.s1]}`);}},{me:'I\'ve answered the question in the plan.'}]},
 {id:'st-plan-approve', stage:'stories', title:'Approve the story plan', act:{type:'chips', chips:()=>[approveChip('po','story generation plan','Approve the story plan')]},
  enter:()=>[askApprove('po','The story generation plan is complete.')],
  body:()=>`<p>This is the first of the two gates in this stage. The <b>Product Owner</b> approves the plan before any story is written.</p><p>Reply in the AI assistant panel.</p>`},
 {id:'st-read', stage:'stories', title:'From requirements to stories', act:{type:'open', paths:[P.st]},
  enter:()=>[{say:'Plan approved. Writing personas and user stories from the approved requirements…'},{write:P.pers},{write:P.st},{say:'Three stories are ready in <b>stories.md</b>. Each acceptance criterion will become an automated test.'},{mate:'ux',say:'I shaped Farah\'s persona with the AI. Look hard at story 2: could a tester answer yes or no to it?'}],
  body:()=>`<p>User stories keep the work tied to real people. Each has <b>acceptance criteria</b>: the conditions that must be true for it to count as done.</p><p>Open ${fl(P.st)}. Read the "Accept when" lines closely. Could each one be tested with a clear yes or no?</p>`},
 {id:'st-decide', stage:'stories', title:'Edit, don\'t just accept', act:{type:'chips', chips:()=>[approveChip('po','User Stories','Approve the stories'),{label:'Request a change: make story 2 testable', text:'Story 2 says "the reason is clear". That can\'t be tested. Please make it specific: the warning must show how many applications were found and the time period.', stay:true, set:()=>{S.changes.stories=true; log('Product Owner requested a change to story 2');}, ops:()=>[{mod:P.st},{badge:'editor'},{say:'Good catch. Story 2 now says the warning must show the count and the time period. The new lines are highlighted in stories.md.'}]}]},
  enter:()=>[askApprove('po','User stories are complete.')],
  body:()=>`<p>Look at story 2 in ${fl(P.st)}. ${tight()?'It now names exactly what the response must include. A test can check that.':'"The reason is clear" is an opinion, not a test. A vague criterion becomes a vague test, and then a vague product.'}</p><p>You can approve the draft as it is, or ask the AI to change it first.</p>${idea('You are the editor, not the author. Changing a draft takes seconds, so use that power.')}`},
 {id:'pl-read', stage:'plan', title:'The AI plans the rest', act:{type:'open', paths:[P.plan]},
  enter:()=>[{say:'Deciding which of the remaining stages this change needs…'},{write:P.plan},{say:'My plan is in <b>execution-plan.md</b>. I\'m skipping four stages and explaining why.'},{mate:'arch',say:'Skipping Application Design is fine by me. It is one small check, and the code is easy to follow.'},{mate:'eng',say:'I disagree. It is a new component that touches storage and the API. I\'d want a short design before anyone builds it.'}],
  body:()=>`<p>AI-DLC v1 is <b>adaptive</b>. A one-line fix skips almost everything. A new product runs every stage. The AI proposes what this change needs.</p><p>Open ${fl(P.plan)} and look at what it marked RUN and SKIP.</p>`},
 {id:'pl-decide', stage:'plan', title:'Challenge the plan', act:{type:'chips', chips:()=>[{...approveChip('pm','Workflow Planning','Approve the plan'), ops:()=>[{log:'Project Manager approved: Workflow Planning'},{fn:()=>{S.clock+=30;}},...(S.changes.plan?[]:[{mate:'eng',say:'Understood. I\'ll look harder at the build plan instead.'}])]},{label:'Request a change: add back Application Design', text:'Please add Application Design back in. I want to see where the new check fits before we build.', stay:true, set:()=>{S.changes.plan=true; log('Team asked for Application Design to be added back');}, ops:()=>[{mod:P.plan},{say:'Done. Application Design is back in the plan. It will run next as its own stage, with its own approval, before I split the work into units.'},{mate:'arch',say:'Fair enough. One short file won\'t slow us down.'}]}]},
  enter:()=>[askApprove('pm','Workflow planning is complete.')],
  body:()=>`<p>The plan is the AI's proposal, not a decision. If a skipped stage worries you, ask for it back.</p><p><b>Tomas and Sam disagree</b> about Application Design, and both have a point. Someone has to settle it. Approve the plan as it is, or ask for the stage back.</p><p>The plan sets out the order of work and its risks, so the <b>Project Manager</b> approves it, with the Architect's advice on what's safe to skip.</p>`},
 {id:'ad-read', stage:'appdesign', when:()=>!!S.changes.plan, title:'The design stage you asked for', act:{type:'open', paths:[P.comp]},
  enter:()=>[{say:'Application Design is back in the plan, so it runs now, before I split the work into units.'},{write:P.comp},{say:'<b>components.md</b> shows where the new check fits in the existing product.'}],
  body:()=>`<p>You asked for this stage, so it runs as a stage of its own, with its own document and its own approval.</p><p>Open ${fl(P.comp)}. For a change this small, the design is one short file.</p>`},
 {id:'ad-approve', stage:'appdesign', when:()=>!!S.changes.plan, title:'Approve the design', act:{type:'chips', chips:()=>[approveChip('arch','Application Design','Approve the design')]},
  enter:()=>[askApprove('arch','Application design is complete.')],
  body:()=>`<p>The design shows how the system is put together, so the <b>Architect</b> approves it.</p>`},
 {id:'un-plan', stage:'units', title:'A plan for splitting the work', act:{type:'open', paths:[P.uowp]},
  enter:()=>[{say:'Units Generation starts with a plan, like User Stories did.'},{write:P.uowp},{say:'<b>unit-of-work-plan.md</b> proposes two units. I have no questions this time: your earlier answers settle the split.'}],
  body:()=>`<p>A <b>unit of work</b> is a group of stories that is designed, built and tested together. Splitting the work lets each piece be finished and reviewed on its own.</p><p>Open ${fl(P.uowp)} to see the split the AI proposes.</p><div class="box"><b>No timetable here</b><p>v1 says what the units are and what order they come in. It does not plan how long each one takes.</p></div>`},
 {id:'un-plan-approve', stage:'units', title:'Approve the unit plan', act:{type:'chips', chips:()=>[approveChip('pm','unit of work plan','Approve the unit plan')]},
  enter:()=>[askApprove('pm','The unit of work plan is complete.')],
  body:()=>`<p>Two gates again. The <b>Project Manager</b> approves the plan first, then the units the AI writes from it.</p>`},
 {id:'un-read', stage:'units', title:'Split the work into units', act:{type:'open', paths:[P.units]},
  enter:()=>[{say:'Plan approved. Generating the units…'},{write:P.units},{write:P.dep},{write:P.map},{say:'Three files are ready. <b>unit-of-work.md</b> describes the two units. The other two show how they depend on each other, and which story belongs to which unit.'}],
  body:()=>`<p>Open ${fl(P.units)}. Each unit lists the requirements and stories it covers.</p><p>${fl(P.map)} gives every story to exactly one unit. ${fl(P.dep)} shows that the console warning needs the check, so the check is built first.</p>`},
 {id:'un-approve', stage:'units', title:'Approve the units', act:{type:'chips', chips:()=>[approveChip('pm','Units Generation','Approve the units')]},
  enter:()=>[askApprove('pm','Units generation is complete.')],
  body:()=>`<p>The units and their order are the delivery plan, so the <b>Project Manager</b> approves them.</p>`},
 {id:'inc-recap', stage:'units', title:'Inception is complete', act:{type:'next'},   body:()=>`<p>Pause and look at the <code>aidlc-docs/inception</code> folder. In a short time the team has agreed:</p><ul><li>how the product works today</li><li>what to build, in ${Object.keys(S.a).length} recorded decisions</li><li>stories with testable criteria</li><li>a plan, and the work split into units</li></ul>${idea('Inception is finished, and not one line of code has been written. That is the point. The thinking comes first, and the AI turns it into code quickly.')}<p>Next is <b>Construction</b>. It is a loop: each unit goes through its design stages and Code Generation before the next unit starts. Build and Test runs once at the end.</p>`},
 {id:'nfr-plan', stage:'nfr', title:'Unit 1: a question before the quality rules', act:{type:'answer', qs:['b1'], file:P.nfrp, hint:'Answer the question in repeat-check-nfr-requirements-plan.md.'},
  enter:()=>[{say:'Construction begins. I take one unit at a time, so I start with <b>repeat-check</b>. Functional Design is skipped, as planned, so its first stage is NFR Requirements.'},{write:P.nfrp},{say:'My plan for this stage has one question. The requirements don\'t say what the check should do when an application has no date of birth, and I won\'t guess. Please answer in <b>repeat-check-nfr-requirements-plan.md</b>.', ask:true, owner:'po'},{mate:'eng',say:'Treat it as a pass. Blocking a real customer over a blank field will flood the lenders\' support lines.'},{mate:'ux',say:'A silent pass hides the gap from analysts, and fraudsters leave fields blank on purpose. At least tell them the check could not run.'}],
  body:()=>`<p><b>Non-functional requirements</b> (NFRs) describe how well something must work: speed, privacy, security, and what happens when things go wrong.</p><p>While planning this stage, the AI found a case nobody had covered: what if an application has no date of birth? It stopped and asked instead of guessing.</p><p>Open ${fl(P.nfrp)} and answer. This is a business decision, so the <b>Product Owner</b> answers.</p><p><b>Sam and Mei disagree</b> in the chat. Read both views, then settle it with your answer.</p>${idea('The AI asks in a file, before any code is planned. Once a build plan is approved the AI follows it exactly, so gaps have to be closed first.')}`,
  after:()=>[{fn:()=>{S.bLock=true; log(`Product Owner answered: missing date of birth, ${b1txt()}`);}},{me:'I\'ve answered the question in the plan.'},S.a.b1==='A'?{mate:'eng',say:'I can live with that. Nobody is blocked, and nothing is hidden.'}:S.a.b1==='B'?{mate:'ux',say:'Then I want to see how often it happens once we are live.'}:{mate:'eng',say:'That will catch more fraud. Expect complaints from genuine customers.'},{say:'Thank you. Writing the NFR requirements…'},{write:P.nfr},{say:'<b>nfr-requirements.md</b> is ready. It includes your answer. I\'ve also proposed storing a scrambled fingerprint of each identity, so we never keep raw personal details for this check.'}]},
 {id:'nfr-read', stage:'nfr', title:'How well must it work?', act:{type:'open', paths:[P.nfr]},
  body:()=>`<p>Open ${fl(P.nfr)}. Find your answer on the error handling line.</p><p>Notice the privacy line too. The AI proposed it, but a person has to agree to it.</p>`},
 {id:'nfr-approve', stage:'nfr', title:'Approve the NFRs', act:{type:'chips', chips:()=>[approveChip('arch','NFR Requirements (repeat-check)','Approve the NFR requirements')]},
  enter:()=>[askApprove('arch','NFR requirements for repeat-check are complete.')],
  body:()=>`<p>These quality rules apply across the whole system, so the <b>Architect</b> approves them.</p>`},
 {id:'cg-plan', stage:'code', title:'Unit 1: a plan before any code', act:{type:'open', paths:[P.cgp]},
  enter:()=>[{say:'NFR Design and Infrastructure Design are skipped, as planned. That brings repeat-check to Code Generation. Before I write code I write a plan, so you can see exactly what I will do.'},{write:P.cgp},{say:'The plan has 7 steps. It is in <b>repeat-check-code-generation-plan.md</b>.'}],
  body:()=>`<p>Code Generation has two parts. First the AI writes a checklist of build steps. Only when that is approved does it write code.</p><p>Open ${fl(P.cgp)}. Step 4 holds the answer you gave a moment ago. Keep the file open: you'll watch the boxes get ticked.</p>`},
 {id:'cg-go', stage:'code', title:'Start the build', act:{type:'chips', chips:()=>[{label:'Approve the plan. Start building.', text:'The plan looks right. Start building.', ops:()=>[{log:'Software Engineer approved: code generation plan (repeat-check)'},...build1()]},
    {label:'Request a change: step 1 should store names and addresses as they are', text:'Step 1 should store the name and address as they are, not a fingerprint.', stay:true, ops:()=>[{say:'I can\'t make that change. <b>nfr-requirements.md</b> says only a scrambled fingerprint is stored, never the raw details, and the Architect approved it. Step 1 stays as it is.'}]},
    {label:'Request a change: step 3 does not match requirement R2', text:`Step 3 only flags an identity when the count is more than ${thrN()}. Requirement R2 says ${thrN()} or more is suspicious. Please fix the plan.`, stay:true, set:()=>{S.changes.cgplan=true; log('Software Engineer requested a correction to step 3 of the code generation plan');}, ops:()=>[{mod:P.cgp},{badge:'plan'},{say:`Good catch. "More than ${thrN()}" would have missed the case exactly at the threshold. Step 3 now says "${thrN()} or more".`}]}]},
  enter:()=>[askApprove('eng','The code generation plan for repeat-check is ready.')],
  body:()=>`<p>The <b>Software Engineer</b> approves the build plan in ${fl(P.cgp)}. After that the AI follows it step by step, and does nothing that is not in it. A mistake in the plan becomes a mistake in the code.</p><p>Check each step against ${fl(P.req)} and ${fl(P.nfr)} before you reply.</p><p>Once you approve, watch the file list and the plan file. New files are marked <b>N</b>.</p>`},
 {id:'cg-read', stage:'code', title:'Read what was built', act:{type:'open', paths:[P.code]},
  enter:()=>S.changes.re?[]:[{mate:'eng',say:'One thing before I review. architecture.md says a failed check adds 30 points. The code says 50. Nobody checked it at the gate, and I nearly designed around the wrong number. I\'ve had the AI correct it.'},{fn:()=>{S.late.re=true;}},{mod:P.arch},{log:'architecture.md corrected late: a failed check adds 50 points, not 30'}],
  body:()=>`<p>Open ${fl(P.code)}. You don't need to read code to follow it: the grey comment lines explain each part, and name the requirement it comes from.</p><p>Find your decisions in it: <code>WINDOW</code>, <code>THRESHOLD</code>, and what happens when the date of birth is missing.</p><div class="box"><b>Also changed</b><p>${fl(P.codes)}, ${fl(P.assess)} and ${fl(P.store)} are marked M. Green lines are the ones the AI added.</p></div>`},
 {id:'cg-approve', stage:'code', title:'Approve the code', act:{type:'chips', chips:()=>[approveChip('eng','Code Generation (repeat-check)','Approve the code'),
    {label:'Request a change: one of story 1\'s criteria has no test', text:'Story 1 has two acceptance criteria. I can only find a test for the first. Please add a test that no warning appears below the threshold.', stay:true, set:()=>{S.changes.tests=true; log('Software Engineer requested a missing test for story 1');}, ops:()=>[{mod:P.tests},{badge:'gap'},{say:'You are right, I missed one. I\'ve added <b>test_no_warning_below_threshold</b> to the test file.'}]},
    {label:'Request a change: WINDOW does not match the requirements', text:'WINDOW in the code does not match the requirements. Please check it.', stay:true, ops:()=>[{say:`I checked. WINDOW is "${win()}", which is what requirement R1 says. I have not changed it.`}]}]},
  enter:()=>[askApprove('eng','Code generation for repeat-check is complete.')],
  body:()=>`<p>The <b>Software Engineer</b> reviews the code against the requirements and the team's standards, then approves it. The AI never approves its own work.</p><p>In ${fl(P.code)}, find your decisions: <code>WINDOW</code>, <code>THRESHOLD</code>, and what happens when the date of birth is missing.</p><p>Then compare ${fl(P.tests)} with ${fl(P.st)}. Does every "Accept when" line for stories 1 and 3 have a test?</p>${idea('The engineer\'s job has moved from writing most of the code to steering and checking it.')}`},
 {id:'cg2-plan', stage:'code', title:'Unit 2: around the loop again', act:{type:'open', paths:[P.cgp2]},
  enter:()=>[{say:'repeat-check is complete. Now <b>console-warning</b> goes through Construction from the top. I decide the design stages again for each unit. This one stores no data and adds no work to an assessment, so NFR Requirements has nothing to add here and I am skipping it for this unit.'},{log:'NFR Requirements skipped for console-warning: no new quality requirements'},{write:P.cgp2},{say:'Its plan has 3 steps. It is in <b>console-warning-code-generation-plan.md</b>.'}],
  body:()=>`<p>Construction is a loop. The first unit is finished, design and code, so the second one starts. Each unit gets its own plans, its own files and its own approvals.</p><p>The stages are judged again for each unit. The console warning has no new speed or privacy concerns, so the AI went straight to its build plan and said why.</p><p>Open ${fl(P.cgp2)}.</p>${idea('One unit at a time, each one finished before the next begins. Nothing is left half-built.')}`},
 {id:'cg2-go', stage:'code', title:'Build the second unit', act:{type:'chips', chips:()=>[{label:'Approve the plan. Start building.', text:'The plan looks right. Start building.', ops:()=>[{log:'Software Engineer approved: code generation plan (console-warning)'},...build2()]}]},
  enter:()=>[askApprove('eng','The code generation plan for console-warning is ready.')],
  body:()=>`<p>The same two gates as before: the <b>Software Engineer</b> approves the plan, then the code.</p>`},
 {id:'cg2-approve', stage:'code', title:'Approve the second unit', act:{type:'chips', chips:()=>[approveChip('eng','Code Generation (console-warning)','Approve the code')]},
  enter:()=>[askApprove('eng','Code generation for console-warning is complete.')],
  body:()=>`<p>${fl(P.view)} is marked M. Open it if you like: the green lines make the warning stand out for analysts${tight()?', and show the count and time period you asked for in story 2':''}.</p><p>With this approval both units are built. Build and Test comes next, once, for everything together.</p>`},
 {id:'bt-run', stage:'test', title:'Build and run the tests', act:{type:'prompt', text:'Run the build and all the tests.'},
  body:()=>`<p>The AI wrote the tests for each unit as it built it. Now that both units are done, it builds the product and runs every test, old and new.</p><p>Send the message and watch the test run.</p>`,
  after:()=>{ const gap=testGap(), bug=planBug(), n=gap?18:19, run=fail=>['$ pytest tests/ -q','tests/test_checks.py ............','tests/test_repeat_applications.py '+(fail?'F':'.')+(gap?'...':'....'),'tests/test_console_warning.py ..','',...(fail?[`FAILED test_warns_at_threshold: no warning at ${thrN()} applications`,`1 failed, ${n-1} passed in 2.38s`]:[`${n} passed in 2.41s`])];
    return [{term:['$ build','Build succeeded.','',...run(bug)]},
     ...(bug?[{say:`One test failed. Step 3 of the plan said "more than ${thrN()}", and I followed the plan exactly. Requirement R2 says "${thrN()} or more". I've corrected the plan and the code, and I'm running the tests again.`},{fn:()=>{S.late.plan=true;}},{log:'Test failure traced to step 3 of the code generation plan. Plan and code corrected'},{mod:P.cgp},{mod:P.code},{mate:'eng',say:'That one is on me. I approved the plan without checking step 3 against the requirements.'},{term:run(false)}]:[]),
     {write:P.bts},{say:`All ${n} tests passed: 12 existing and ${n-12} new. The results are in <b>build-and-test-summary.md</b>.`},
     ...(gap?[{mate:'eng',say:'Hold on. Story 1 has two acceptance criteria, and I count one test for it. We approved the code with a gap. I\'ve asked the AI to add the missing test.'},{fn:()=>{S.late.test=true;}},{log:'Missing test for story 1 found after code approval. Test added'},{mod:P.tests},{term:['$ pytest tests/ -q','19 passed in 2.44s']},{mod:P.bts},{say:'Added <b>test_no_warning_below_threshold</b>. All 19 tests pass, and the summary is updated.'}]:[])]; }},
 {id:'bt-read', stage:'test', title:'Trace the results', act:{type:'open', paths:[P.bts]},
  body:()=>`<p>Open ${fl(P.bts)}. Each new test names the story or decision it proves.</p>${idea('This is traceability: a line you can follow from the intent, to a requirement, to a story, to a passing test.')}`},
 {id:'bt-try', stage:'test', title:'Try what you built', act:{type:'preview', app:'alex', built:true}, enter:()=>[{mate:'ux',say:'Try it the way Farah would. Would she notice the warning and understand it?'}],   body:()=>{ const ran=S.runs['b:alex']; const r=ran?assess(APPS.alex,true):null; const hit=r&&r.codes.some(c=>c[0]==='ID-VEL-01');
   return `<p>Tests are one kind of proof. Using the product is another. The app preview now runs <b>your build</b>.</p><p>Select <b>Alex Morgan</b> again and press <b>Run risk assessment</b>.</p>${ran?`<div class="box"><b>${hit?'The product now catches it':'Alex was not flagged'}</b><p>${hit?`Alex's 4th application this week now ${raise()?'scores '+r.score+' and ':''}carries reason code ID-VEL-01.${tight()?' Because you tightened story 2, the warning says how many applications and over what period.':' The warning text is vague, because story 2 only asked for a "clear" reason.'}`:`With a ${win()} period and a threshold of ${thrN()}, Alex's applications fall below the line. The product does exactly what you asked. If that isn't what you meant, the fix is in the requirements, not the code.`}</p><p>Use <b>Before</b> and <b>Your build</b> above the app to compare.</p></div>`:''}`; }},
 {id:'bt-explore', stage:'test', title:'Test the edge cases', act:{type:'next'},
  body:()=>{ const n=Object.keys(APPS).filter(k=>S.runs['b:'+k]).length; return `<p>Now try the other applicants in your build. Each one tests a decision you made.</p><ul><li><b>Riley Chen</b>: a genuine first application. It should stay low risk.</li><li><b>Maria Garcia</b>: shares a name and birthday with another customer. Does your definition of "same identity" wrongly flag her?</li><li><b>Jo Lee</b>: no date of birth. This shows the answer you gave in the NFR plan.</li></ul><div class="box"><b>${n} of 4 applicants tested in your build</b><p>Try as many as you like, then continue when you're ready.</p></div>`; }},
 {id:'bt-approve', stage:'test', title:'Accept the result', act:{type:'chips', chips:()=>[approveChip('po','Build and Test','Accept the result')]},
  enter:()=>[askApprove('po','Build and test is complete.')],
  body:()=>`<p>The <b>Product Owner</b> accepts the result against the stories they approved. This replaces the sprint review demo.</p>`},
 {id:'ops', stage:'ops', title:'Release it, the usual way', act:{type:'prompt', text:'Release the change through our existing pipeline.'},
  enter:()=>[{say:'In AI-DLC v1, Operations is a placeholder. I have no rules for it, so the release goes through your existing pipeline and process.'},{mate:'pm',say:'Release slot is booked and the change approval is signed off. Sam, go ahead.'}],
  after:()=>[{term:['$ git push origin main','$ release-pipeline deploy identity-risk-api','[1/4] Build release package ....... done','[2/4] Deploy to staging ........... done','[3/4] Smoke tests ................. 5 passed','[4/4] Deploy to production ........ done','','identity-risk-api v2.4.0 is live']},{log:'Change released through the existing pipeline'},{say:'The change is live. AI-DLC v1 writes no documents for this phase.'},{mate:'po',say:'I\'ll let the lenders know the new reason code is on.'}],
  body:()=>`<p>The third phase covers deploying and running the product. In v1 it is named but not yet defined, so the team releases the way it does today.</p><p>Send the message to run the team's existing release pipeline.</p>`},
 {id:'ops-live', stage:'ops', title:'It\'s live', act:{type:'next'}, after:()=>[{badge:'ship'}],
  body:()=>`<p>The change is in production. Lenders will now see the warning on real applications.</p><div class="box"><b>What v2 adds here</b><p>A full Operations phase: deployment, monitoring, incident runbooks, and a feedback loop that sends what you learn in production back to the start.</p></div><p>Continue to see what happened next.</p>`},

// l and r are in rem.
function setPanes(l, r, keep){ [['--wl',l],['--wr',r]].forEach(([k,v])=>{ if (v) mainEl.style.setProperty(k, v+'rem'); else mainEl.style.removeProperty(k); });
  if (!keep) try { if (l||r) localStorage.setItem(PKEY, JSON.stringify({l,r})); else localStorage.removeItem(PKEY); } catch(e){} }
function resizePane(side, w){ const u=remPx(), room=mainEl.clientWidth-(40+300)*u/16-paneW(side==='l'?'r':'l'); w=Math.max(230*u/16, Math.min(w, room)); const toRem=x=>+(x/u).toFixed(3); setPanes(toRem(side==='l'?w:paneW('l')), toRem(side==='r'?w:paneW('r'))); }
try { const d=JSON.parse(localStorage.getItem(PKEY)||'null'); if (d) setPanes(+d.l||0, +d.r||0, true); } catch(e){}
document.querySelectorAll('.split').forEach(sp=>{ const side=sp.dataset.side, dir=side==='l'?1:-1;
  sp.addEventListener('pointerdown', e=>{ e.preventDefault(); sp.setPointerCapture(e.pointerId); const x0=e.clientX, w0=paneW(side); sp.classList.add('drag'); document.body.classList.add('resizing');
    const mv=ev=>resizePane(side, w0+dir*(ev.clientX-x0)), up=()=>{ sp.classList.remove('drag'); document.body.classList.remove('resizing'); sp.removeEventListener('pointermove',mv); sp.removeEventListener('pointerup',up); sp.removeEventListener('pointercancel',up); };
    sp.addEventListener('pointermove',mv); sp.addEventListener('pointerup',up); sp.addEventListener('pointercancel',up); });
  sp.addEventListener('keydown', e=>{ if (e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return; e.preventDefault(); e.stopPropagation(); resizePane(side, paneW(side)+dir*(e.key==='ArrowRight'?1.5:-1.5)*remPx()); });
  sp.addEventListener('dblclick', ()=>setPanes(0,0));
});
function fitTop(){ const top=document.querySelector('.top'), st=document.getElementById('stepper'); top.classList.remove('tight'); if (st.scrollWidth>st.clientWidth+1) top.classList.add('tight'); }
addEventListener('resize', fitTop);
/* Size buttons. They multiply the automatic size, which still follows the screen. Remembered in this browser. */
const ZOOMS=[0.7,0.8,0.9,1,1.1,1.2,1.3,1.45,1.6], ZKEY='aidlc-lab-zoom';
let zoomI=ZOOMS.indexOf(1);
function setZoom(i, keep){ zoomI=Math.max(0, Math.min(ZOOMS.length-1, i)); const z=ZOOMS[zoomI];
  if (z===1) document.documentElement.style.removeProperty('--uz'); else document.documentElement.style.setProperty('--uz', z);
  document.getElementById('zoom-reset').textContent=Math.round(z*100)+'%';
  document.getElementById('zoom-out').disabled=zoomI===0; document.getElementById('zoom-in').disabled=zoomI===ZOOMS.length-1;
  fitTop();
  if (!keep) try { if (z===1) localStorage.removeItem(ZKEY); else localStorage.setItem(ZKEY, z); } catch(e){} }
try { const z=parseFloat(localStorage.getItem(ZKEY)); setZoom(ZOOMS.includes(z)?ZOOMS.indexOf(z):zoomI, true); } catch(e){ setZoom(zoomI, true); }
S=fresh(); load(); renderAll();
</script>
</body>
